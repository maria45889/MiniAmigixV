<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniAmigixV</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap');
  :root{
    --bg-0:#0c0915; --bg-1:#120e20; --bg-2:#19142e; --bg-3:#231c3f;
    --border:rgba(255,255,255,0.08); --pink:#ff5fd0; --purple:#6d35e3; --purple-light:#8b5cf6;
    --cyan:#5fe0ff; --green:#5dcaa5; --text:#ffffff; --text-dim:#a79fc7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;color:var(--text);font-family:'Sora',system-ui,sans-serif;background:var(--bg-0);}
  .app{display:flex;height:100vh;overflow:hidden;}
  
  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-thumb{background:#2a2145;border-radius:6px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--purple-light);}
  ::-webkit-scrollbar-track{background:transparent;}
  button,input,select{font-family:inherit;}

  /* SIDEBAR */
  .sidebar{width:230px;background:linear-gradient(180deg,#100c1d,#0a0714);border-right:1px solid rgba(255,255,255,0.06);display:flex;flex-direction:column;flex-shrink:0;}
  .logo-box{margin:16px 16px 20px;height:82px;border-radius:18px;background:linear-gradient(135deg,#2a1140,#130a24);display:flex;align-items:center;justify-content:center;border:1px solid #3c1d5c;position:relative;overflow:hidden;}
  .logo-box::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 20%, rgba(255,95,208,.3), transparent 65%);}
  .logo-box span{position:relative;font-family:'Space Grotesk',sans-serif;font-style:italic;font-weight:700;font-size:21px;background:linear-gradient(90deg,var(--pink),#a855f7 55%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px rgba(255,95,208,.5));}
  
  .nav{flex:1;padding:0 12px;overflow-y:auto;}
  .nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:var(--text-dim);font-size:13.5px;font-weight:500;cursor:pointer;margin-bottom:3px;transition:all .18s ease;}
  .nav-item:hover{background:rgba(255,255,255,0.05);color:var(--text);}
  .nav-item.active{background:linear-gradient(90deg,#6d35e3,#8146f2);color:#fff;box-shadow:0 4px 20px rgba(109,53,227,0.45);font-weight:600;}
  .nav-item .ic{width:18px;text-align:center;font-size:14px;}
  .nav-item.logout{color:#ff5555;margin-top:14px;font-weight:600;}
  .nav-item.logout:hover{background:rgba(255,85,85,0.1);color:#ff7777;}
  
  .sidebar-bottom{padding:14px 18px;border-top:1px solid rgba(255,255,255,0.06);display:flex;gap:16px;color:var(--text-dim);font-size:15px;}
  .sidebar-bottom span{cursor:pointer;transition:color .15s;}
  .sidebar-bottom span:hover{color:var(--cyan);}

  /* MAIN AREA */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg-0);}
  
  /* TOPBAR */
  .topbar{height:60px;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(12,9,21,0.85);backdrop-filter:blur(12px);flex-shrink:0;}
  .breadcrumb{font-size:14px;color:var(--text-dim);font-weight:500;}
  .breadcrumb b{color:var(--text);font-family:'Space Grotesk',sans-serif;font-weight:700;}
  
  .search-wrap{position:relative;width:340px;}
  .search{background:#181329;border:1px solid rgba(255,255,255,0.1);border-radius:22px;padding:9px 18px;color:var(--text);font-size:13px;width:100%;outline:none;transition:all .2s ease;}
  .search::placeholder{color:#766c98;}
  .search:focus{border-color:var(--purple-light);box-shadow:0 0 0 3px rgba(139,92,246,0.25);}
  
  .top-icons{display:flex;align-items:center;gap:18px;color:var(--text-dim);font-size:16px;}
  .top-icons span{cursor:pointer;transition:all .15s ease;}
  .top-icons span:hover{color:var(--cyan);transform:translateY(-1px);}
  .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#a855f7,var(--pink));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;box-shadow:0 0 0 2px #181329,0 0 12px rgba(168,85,247,0.5);}

  /* CONTENT AREA */
  .content{flex:1;overflow-y:auto;padding:24px 28px 48px;}

  .fadein{animation:fadeUp .35s ease both;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  /* HERO CARD */
  .hero-card{
    background: linear-gradient(135deg, #6025d5, #7533e6 60%, #4618a5);
    border-radius: 20px;
    padding: 32px 36px;
    position: relative;
    overflow: hidden;
    margin-bottom: 22px;
    box-shadow: 0 12px 36px rgba(96,37,213,0.3);
  }
  .hero-card h1{
    font-size: 28px;
    margin: 0 0 10px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.5px;
  }
  .hero-card h1 u{
    text-decoration: underline;
    text-decoration-color: var(--cyan);
    text-underline-offset: 4px;
    text-decoration-thickness: 2.5px;
  }
  .hero-card p{
    color: rgba(255,255,255,0.85);
    font-size: 13.5px;
    max-width: 460px;
    margin: 0 0 22px;
    line-height: 1.5;
  }
  .hero-actions{display:flex;gap:12px;}
  .hero-btn{
    padding: 12px 22px;
    border-radius: 20px;
    font-size: 13.5px;
    font-weight: 700;
    border: none;
    cursor: pointer;
    transition: transform .18s ease, box-shadow .18s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
  }
  .hero-btn:hover{transform:translateY(-2px);}
  .hero-btn.primary{
    background: #ffffff;
    color: #5b22d0;
    box-shadow: 0 4px 18px rgba(0,0,0,0.25);
  }
  .hero-btn.ghost{
    background: rgba(255,255,255,0.16);
    color: #ffffff;
    border: 1px solid rgba(255,255,255,0.3);
  }
  .hero-mascot-svg{
    position: absolute;
    right: 36px;
    bottom: 12px;
    width: 100px;
    height: 100px;
    animation: float 3.5s ease-in-out infinite;
    filter: drop-shadow(0 8px 20px rgba(0,0,0,0.4));
  }

  /* FEATURE GRID (2 COLUMNS × 3 ROWS) */
  .feature-grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .feature-card{
    border-radius: 18px;
    padding: 22px 24px;
    cursor: pointer;
    transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    border: 1px solid rgba(255,255,255,0.06);
    color: #fff;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 140px;
  }
  .feature-card:hover{
    transform: translateY(-4px);
    box-shadow: 0 14px 32px rgba(0,0,0,0.45);
    border-color: rgba(255,255,255,0.18);
  }
  .feature-card .f-icon{
    width: 38px;
    height: 38px;
    border-radius: 12px;
    background: rgba(255,255,255,0.16);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    margin-bottom: 14px;
  }
  .feature-card h3{
    margin: 0 0 6px;
    font-size: 16px;
    font-weight: 700;
    font-family: 'Space Grotesk', sans-serif;
  }
  .feature-card p{
    margin: 0;
    font-size: 12.5px;
    color: rgba(255,255,255,0.78);
    line-height: 1.4;
  }

  /* CARD COLORS EXACT TO SCREENSHOT */
  .card-chat{ background: linear-gradient(135deg, #2e1763, #1c0e42); }
  .card-music{ background: linear-gradient(135deg, #123875, #0b234a); }
  .card-games{ background: linear-gradient(135deg, #0f5945, #09382b); }
  .card-events{ background: linear-gradient(135deg, #823817, #54240f); }
  .card-weather{ background: linear-gradient(135deg, #0c585a, #07393a); }
  .card-translate{ background: linear-gradient(135deg, #0c564c, #073832); }

  /* CHAT STYLES */
  .chat-page-header { text-align: center; margin-bottom: 20px; }
  .chat-page-header h1 { font-size: 24px; font-weight: 700; font-family: 'Space Grotesk', sans-serif; color: #fff; margin: 0 0 4px; }
  .chat-page-header p { color: var(--text-dim); font-size: 13.5px; margin: 0; }

  .chat-shell { display: flex; border: 1px solid var(--border); border-radius: 20px; overflow: hidden; background: linear-gradient(180deg, #120e22, #0d091a); box-shadow: 0 20px 60px rgba(0,0,0,0.45); height: calc(100vh - 170px); }
  .chat-list { width: 240px; border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; background: rgba(0,0,0,0.18); }
  .chat-list-head { padding: 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
  .chat-list-head b { font-size: 15px; font-family: 'Space Grotesk', sans-serif; color: #fff; }
  .new-chat-btn { background: linear-gradient(90deg, #6d35e3, #8146f2); border: none; color: #fff; font-size: 12px; font-weight: 600; padding: 7px 14px; border-radius: 16px; cursor: pointer; box-shadow: 0 4px 14px rgba(109,53,227,0.35); transition: transform 0.15s ease; }
  .new-chat-btn:hover { transform: translateY(-1px); }
  .chat-search { margin: 12px; background: #181329; border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; color: var(--text-dim); font-size: 12px; outline: none; }
  .chat-search::placeholder { color: #766c98; }
  .chat-entry { padding: 12px 16px; border-left: 3px solid #8146f2; background: #19142e; margin: 0 10px 8px; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,0.2); }
  .chat-entry b { font-size: 13.5px; display: block; font-weight: 600; color: #fff; }
  .chat-entry span { font-size: 11.5px; color: var(--text-dim); display: block; margin-top: 3px; }

  .chat-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .chat-main-top { padding: 14px 22px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.1); }
  .chat-title-path { font-size: 14px; font-family: 'Space Grotesk', sans-serif; }
  .ai-pill { border: 1px solid #6d35e3; background: rgba(109,53,227,0.12); color: #a78bfa; font-size: 11.5px; font-weight: 600; padding: 5px 12px; border-radius: 16px; display: flex; align-items: center; gap: 6px; }
  .ai-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 6px var(--cyan); animation: pulse 1.6s infinite; }

  .messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
  .empty-state { text-align: center; max-width: 580px; margin: auto; width: 100%; }
  .bot-avatar { width: 64px; height: 64px; border-radius: 20px; background: linear-gradient(135deg, #a855f7, #ff5fd0); margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 36px rgba(255,95,208,0.55); animation: float 3.5s ease-in-out infinite; }
  .empty-state h2 { font-size: 22px; margin: 0 0 6px; font-weight: 700; font-family: 'Space Grotesk', sans-serif; color: #fff; }
  .empty-state h2 b { color: #ff5fd0; font-weight: 700; }
  .empty-state .sub-lead { color: var(--text-dim); font-size: 13px; margin: 0 0 16px; }

  .chips-group { display: flex; flex-direction: column; gap: 10px; align-items: center; margin-bottom: 20px; }
  .chips-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .chip { border: 1px solid var(--border); background: #18132b; color: #d1cbe8; font-size: 12.5px; font-weight: 500; padding: 8px 16px; border-radius: 20px; cursor: pointer; transition: all 0.18s ease; display: inline-flex; align-items: center; gap: 6px; }
  .chip:hover { border-color: #8146f2; color: #fff; transform: translateY(-2px); box-shadow: 0 4px 14px rgba(129,70,242,0.3); }
  .chip-ic { font-size: 13px; }

  .chat-divider { border: none; border-top: 1px solid var(--border); margin: 0 0 20px; width: 100%; }

  .quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
  .quick-card { border: 1px solid var(--border); background: #161126; border-radius: 14px; padding: 16px; text-align: center; cursor: pointer; font-size: 13px; font-weight: 600; color: #fff; transition: all 0.18s ease; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 80px; }
  .quick-card:hover { border-color: var(--cyan); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(95,224,255,0.25); }
  .quick-card.selected { border-color: var(--cyan); box-shadow: 0 0 0 1px var(--cyan); }
  .quick-card .q-icon { font-size: 20px; }

  .input-bar { border-top: 1px solid var(--border); padding: 14px 20px; display: flex; align-items: center; gap: 12px; background: rgba(0,0,0,0.18); }
  .bar-icon { color: var(--text-dim); cursor: pointer; font-size: 18px; transition: color 0.15s ease; }
  .bar-icon:hover { color: var(--cyan); }
  .input-wrap { flex: 1; }
  .input-wrap input { width: 100%; background: #181329; border: 1px solid var(--border); border-radius: 22px; padding: 11px 18px; color: var(--text); font-size: 13.5px; outline: none; transition: all 0.2s ease; }
  .input-wrap input:focus { border-color: #8146f2; box-shadow: 0 0 0 3px rgba(129,70,242,0.2); }
  .send-btn { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #a855f7, #ff5fd0); border: none; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; box-shadow: 0 4px 16px rgba(255,95,208,0.4); transition: transform 0.15s ease, box-shadow 0.15s ease; }
  .send-btn:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(255,95,208,0.6); }

  .msg-row{display:flex;gap:10px;max-width:78%;animation:msgIn .3s cubic-bezier(.2,.8,.3,1) both;margin-bottom:12px;}
  .msg-row.user{align-self:flex-end;flex-direction:row-reverse;}
  .msg-avatar{width:30px;height:30px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;}
  .msg-avatar.bot{background:linear-gradient(135deg,var(--purple-light),var(--pink));}
  .msg-avatar.user{background:var(--bg-2);border:1px solid var(--border);font-size:11px;font-weight:700;color:var(--text-dim);}
  .bubble{padding:11px 16px;border-radius:16px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;}
  .msg-row.bot .bubble{background:var(--bg-2);border:1px solid var(--border);border-top-left-radius:4px;}
  .msg-row.user .bubble{background:linear-gradient(135deg,var(--purple),#8146f2);border-top-right-radius:4px;color:#fff;}

  /* MUSIC PAGE STYLES */
  .music-page-header { text-align: center; margin-bottom: 20px; }
  .music-page-header h1 { font-size: 24px; font-weight: 700; font-family: 'Space Grotesk', sans-serif; color: #ffffff; margin: 0 0 4px; }
  .music-page-header p { color: var(--text-dim); font-size: 13.5px; margin: 0; }

  .music-layout { display: grid; grid-template-columns: 1fr 300px; gap: 20px; align-items: start; }
  .music-main-col { flex: 1; }
  .music-side-col { width: 300px; }

  .card-box { background: #161127; border: 1px solid var(--border); border-radius: 18px; padding: 22px; }
  
  .player-card { margin-bottom: 20px; }
  .player-row { display: flex; gap: 16px; align-items: center; margin-bottom: 18px; }
  .player-art { width: 60px; height: 60px; border-radius: 14px; background: linear-gradient(135deg, #a855f7, #ff5fd0); display: flex; align-items: center; justify-content: center; font-size: 22px; color: #fff; flex-shrink: 0; box-shadow: 0 4px 16px rgba(168,85,247,0.4); }
  .player-art.spin { animation: spin 4s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .player-info h3 { margin: 0 0 4px; font-size: 16px; font-weight: 700; color: #fff; font-family: 'Space Grotesk', sans-serif; }
  .player-info p { margin: 0; color: var(--text-dim); font-size: 13px; }

  .progress-bar-wrap { cursor: pointer; padding: 4px 0; margin-bottom: 6px; }
  .progress-bar { height: 4px; background: #241d3d; border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #a855f7, #5fe0ff); width: 0%; }

  .time-row { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--text-dim); margin-bottom: 16px; }
  
  .player-controls { display: flex; align-items: center; gap: 16px; justify-content: center; }
  .ctrl-btn { width: 38px; height: 38px; border-radius: 50%; background: #201938; border: 1px solid var(--border); color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: all 0.15s ease; }
  .ctrl-btn:hover { background: #2a224a; color: #fff; }
  .ctrl-btn.play-btn-main { width: 48px; height: 48px; background: linear-gradient(135deg, #a855f7, #ff5fd0); border: none; font-size: 18px; color: #fff; box-shadow: 0 4px 18px rgba(255,95,208,0.45); }
  .ctrl-btn.play-btn-main:hover { transform: scale(1.05); box-shadow: 0 6px 22px rgba(255,95,208,0.6); }

  .section-label { font-size: 11px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 14px; }

  .form-field { margin-bottom: 14px; }
  .form-field label { font-size: 12px; color: var(--text-dim); display: block; margin-bottom: 6px; }
  .form-field input { width: 100%; background: #181329; border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; color: var(--text); font-size: 13px; outline: none; }
  .form-field input:focus { border-color: #8146f2; }

  .btn-pink-gradient { width: 100%; padding: 12px; border-radius: 12px; background: linear-gradient(90deg, #c084fc, #ff5fd0); border: none; color: #fff; font-weight: 700; font-size: 13.5px; cursor: pointer; box-shadow: 0 4px 18px rgba(255,95,208,0.4); transition: all 0.18s ease; }
  .btn-pink-gradient:hover { transform: translateY(-1px); box-shadow: 0 6px 22px rgba(255,95,208,0.55); }

  .lib-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: #18132b; border: 1px solid var(--border); cursor: pointer; transition: all 0.18s ease; margin-bottom: 8px; }
  .lib-item:hover { background: #201938; border-color: #8146f2; }
  .lib-art { width: 36px; height: 36px; border-radius: 8px; background: rgba(168,85,247,0.2); color: #c084fc; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .lib-meta { flex: 1; min-width: 0; }
  .lib-meta b { display: block; font-size: 13px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lib-meta span { font-size: 11.5px; color: var(--text-dim); }
  .lib-actions { display: flex; gap: 10px; color: var(--text-dim); font-size: 14px; }
  .lib-actions span { cursor: pointer; transition: color 0.15s ease; }
  .lib-actions span:hover { color: #ff5fd0; }

  .stat-mini-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat-box { background: #18132b; border: 1px solid var(--border); border-radius: 12px; padding: 16px 12px; text-align: center; }
  .stat-box b { display: block; font-size: 20px; font-weight: 700; color: #fff; font-family: 'Space Grotesk', sans-serif; margin-bottom: 4px; }
  .stat-box span { font-size: 11px; color: var(--text-dim); }

  /* ================= GAMES PAGE STYLES (MATCHING SCREENSHOT EXACTLY) ================= */
  .games-page-header {
    text-align: center;
    margin-bottom: 22px;
  }
  .games-page-header h1 {
    font-size: 24px;
    font-weight: 700;
    font-family: 'Space Grotesk', sans-serif;
    color: #ffffff;
    margin: 0 0 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .games-page-header p {
    color: var(--text-dim);
    font-size: 13.5px;
    margin: 0;
  }

  .games-top-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 22px;
  }
  .game-stat-box {
    text-align: center;
    padding: 16px 12px;
  }
  .game-stat-box b {
    display: block;
    font-size: 22px;
    font-weight: 700;
    font-family: 'Space Grotesk', sans-serif;
    color: #fff;
    margin-bottom: 4px;
  }
  .game-stat-box span {
    font-size: 11.5px;
    color: var(--text-dim);
  }

  .games-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  .game-card {
    background: #161127;
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 24px 20px 20px;
    text-align: center;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
  }
  .game-card:hover {
    transform: translateY(-4px);

function getAudioEl(){ return document.getElementById('audioEl'); }
function fmtTime(sec){ sec=Math.max(0,Math.floor(sec||0)); const m=Math.floor(sec/60); const s=sec%60; return m+':'+String(s).padStart(2,'0'); }

function renderLibraryList(){
  const m = musicState;
  if(m.library.length===0) return '<p style="color:var(--text-dim);font-size:12px;">Aún no has añadido canciones.</p>';
  return m.library.map(t=>`
    <div class="lib-item ${m.current && m.current.id===t.id ? 'active':''}" onclick="playTrackById(${t.id})">
      <div class="lib-art">♫</div>
      <div class="lib-meta"><b>${t.name}</b><span>${t.artist||'Artista desconocido'}</span></div>
      <div class="lib-actions" onclick="event.stopPropagation()">
        <span onclick="toggleFav(${t.id})">${t.fav?'❤':'♡'}</span>
        <span onclick="removeTrack(${t.id})">&#128465;</span>
      </div>
    </div>`).join('');
}

function renderFavList(){
  const favs = musicState.library.filter(t=>t.fav);
  if(favs.length===0) return '<p style="color:var(--text-dim);font-size:12px;">Añade canciones a favoritas.</p>';
  return favs.map(t=>`<div class="lib-item" onclick="playTrackById(${t.id})"><div class="lib-art">❤</div><div class="lib-meta"><b>${t.name}</b><span>${t.artist||''}</span></div></div>`).join('');
}

function addTrack(){
  const name = document.getElementById('trackName').value.trim();
  const artist = document.getElementById('trackArtist').value.trim();
  const fileInput = document.getElementById('trackFile');
  if(!name || !fileInput.files[0]){ alert('Ponle un nombre y elige un archivo de audio.'); return; }
  const url = URL.createObjectURL(fileInput.files[0]);
  const id = Date.now();
  musicState.library.push({id, name, artist, url, fav:false});
  renderPage();
}

function removeTrack(id){
  musicState.library = musicState.library.filter(t=>t.id!==id);
  if(musicState.current && musicState.current.id===id){ musicState.current=null; musicState.playing=false; }
  renderPage();
}

function toggleFav(id){ const t=musicState.library.find(t=>t.id===id); if(t) t.fav=!t.fav; renderPage(); }

function playTrackById(id){
  const t = musicState.library.find(t=>t.id===id); if(!t) return;
  musicState.current = t; renderPage();
  setTimeout(()=>{
    const audio = getAudioEl();
    if(t.url && audio){ audio.src = t.url; audio.play().then(()=>{ musicState.playing=true; syncPlayUI(); }).catch(()=>{ musicState.playing=false; }); }
  },0);
}

function togglePlay(){
  const audio = getAudioEl(); if(!audio || !musicState.current) return;
  if(musicState.playing){ audio.pause(); musicState.playing=false; }
  else{ audio.play(); musicState.playing=true; }
  syncPlayUI();
}

function syncPlayUI(){
  const btn = document.getElementById('playBtn'); if(btn) btn.innerHTML = musicState.playing ? '❚❚' : '▶';
  const art = document.querySelector('.player-art'); if(art){ if(musicState.playing) art.classList.add('spin'); else art.classList.remove('spin'); }
}

function onTimeUpdate(){
  const audio=getAudioEl(); if(!audio||!audio.duration) return;
  const pct = (audio.currentTime/audio.duration)*100;
  musicState.progress = pct;
  const fill=document.getElementById('progressFill'); if(fill) fill.style.width=pct+'%';
  const tc=document.getElementById('timeCur'); if(tc) tc.textContent=fmtTime(audio.currentTime);
  const td=document.getElementById('timeDur'); if(td) td.textContent=fmtTime(audio.duration);
}

function seekTrack(e){
  const audio=getAudioEl(); if(!audio||!audio.duration) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const pct = (e.clientX-rect.left)/rect.width;
  audio.currentTime = pct*audio.duration;
}

function onTrackEnded(){ musicState.playing=false; syncPlayUI(); }

function nextTrack(){
  const list=musicState.library; if(list.length===0) return;
  const idx = musicState.current ? list.findIndex(t=>t.id===musicState.current.id) : -1;
  const next = list[(idx+1)%list.length]; playTrackById(next.id);
}

function prevTrack(){
  const list=musicState.library; if(list.length===0) return;
  const idx = musicState.current ? list.findIndex(t=>t.id===musicState.current.id) : 0;
  const prev = list[(idx-1+list.length)%list.length]; playTrackById(prev.id);
}

/* ============================================================
   EVENTS MODULE
   ============================================================ */
let eventsState = {
  view: 'month', // 'today' | 'week' | 'month'
  calMonth: new Date().getMonth(),
  calYear: new Date().getFullYear(),
  events: [
    {id:1, name:'Cumpleaños', date:'2026-08-23', time:'08:00', icon:'🎂', color:'#ff5fd0'}
  ],
  showForm: false,
  formData: {name:'', date:'', time:'', icon:'🎂'}
};

const WEEKDAYS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MONTHS_ES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

function renderEvents(){
  const s = eventsState;
  const today = new Date();
  const todayStr = today.toISOString().slice(0,10);

  // Countdown to next event
  const nextEv = [...s.events].sort((a,b)=>new Date(a.date)-new Date(b.date)).find(e=>new Date(e.date)>=today);
  let countdownHTML = '';
  if(nextEv){
    const diff = Math.max(0, Math.floor((new Date(nextEv.date+' '+nextEv.time) - today)/1000));
    const days = Math.floor(diff/86400);
    const hours = Math.floor((diff%86400)/3600);
    const mins = Math.floor((diff%3600)/60);
    countdownHTML = `
    <div class="event-banner">
      <div class="event-banner-icon">${nextEv.icon}</div>
      <div class="event-banner-meta">
        <b>${nextEv.name}</b>
        <span>${nextEv.date} · ${nextEv.time} - tase</span>
      </div>
      <div class="event-countdown">
        <div class="countdown-unit"><b>${days}</b><span>días</span></div>
        <div class="countdown-sep">:</div>
        <div class="countdown-unit"><b>${String(hours).padStart(2,'0')}</b><span>horas</span></div>
        <div class="countdown-sep">:</div>
        <div class="countdown-unit"><b>${String(mins).padStart(2,'0')}</b><span>mín.</span></div>
      </div>
      <span class="event-banner-actions" onclick="deleteEvent(${nextEv.id})">&#128465;</span>
    </div>`;
  }

  // Calendar grid
  const firstDay = new Date(s.calYear, s.calMonth, 1).getDay();
  const daysInMonth = new Date(s.calYear, s.calMonth+1, 0).getDate();
  let cells = '';
  // Empty leading cells
  for(let i=0;i<firstDay;i++) cells += `<div class="cal-day empty"></div>`;
  // Day cells
  for(let d=1;d<=daysInMonth;d++){
    const dateStr = `${s.calYear}-${String(s.calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = dateStr===todayStr;
    const dayEvs = s.events.filter(e=>e.date===dateStr);
    const hasEv = dayEvs.length>0;
    cells += `<div class="cal-day ${isToday?'today':''} ${hasEv&&!isToday?'has-event':''}" onclick="calDayClick('${dateStr}')">
      <div class="cal-day-num">${d}</div>
      ${dayEvs.map(e=>`<div class="cal-event-dot">${e.icon} ${e.name}</div>`).join('')}
    </div>`;
  }

  // Upcoming events list (sidebar)
  const upcomingHTML = s.events.length===0
    ? '<p style="color:var(--text-dim);font-size:12px;">Sin próximos eventos.</p>'
    : s.events.map(e=>`
      <div class="upcoming-item">
        <div class="ev-icon">${e.icon}</div>
        <div class="ev-meta"><b>${e.name}</b><span>${e.date} · ${e.time} - tase</span></div>
        <span class="ev-del" onclick="deleteEvent(${e.id})">&#128465;</span>
      </div>`).join('');

  // Modal
  const modal = s.showForm ? `
    <div class="ev-modal-overlay" onclick="if(event.target.classList.contains('ev-modal-overlay')) closeEvForm()">
      <div class="ev-modal">
        <span class="ev-modal-close" onclick="closeEvForm()">&#10005;</span>
        <h3>+ Nuevo Evento</h3>
        <div class="form-field"><label>Nombre del evento</label><input id="ef_name" value="${s.formData.name}" placeholder="Ej. Reunión de equipo"></div>
        <div class="form-field"><label>Fecha</label><input id="ef_date" type="date" value="${s.formData.date}"></div>
        <div class="form-field"><label>Hora</label><input id="ef_time" type="time" value="${s.formData.time}"></div>
        <div class="form-field"><label>Emoji</label><input id="ef_icon" value="${s.formData.icon}" placeholder="🎂" maxlength="2"></div>
        <button class="btn-pink-gradient" onclick="saveEvent()">Guardar evento</button>
      </div>
    </div>` : '';

  return `
  ${modal}
  <div class="fadein" style="margin-bottom:14px;">
    <div class="events-tabs">
      <div class="events-tab ${s.view==='today'?'active':''}" onclick="setEvView('today')">Hoy</div>
      <div class="events-tab ${s.view==='week'?'active':''}" onclick="setEvView('week')">Esta semana</div>
      <div class="events-tab ${s.view==='month'?'active':''}" onclick="setEvView('month')">Este mes</div>
    </div>
  </div>

  <div class="events-layout fadein">
    <div class="events-main">
      ${countdownHTML}
      <div class="calendar-wrap">
        <div class="calendar-header">
          <button class="cal-nav" onclick="shiftMonth(-1)">&#8249;</button>
          <h3>${MONTHS_ES[s.calMonth]} ${s.calYear}</h3>
          <button class="cal-nav" onclick="shiftMonth(1)">&#8250;</button>
        </div>
        <div class="calendar-grid">
          ${WEEKDAYS.map(w=>`<div class="cal-weekday">${w}</div>`).join('')}
          ${cells}
        </div>
      </div>
    </div>

    <div>
      <div class="upcoming-box">
        <div class="section-label">PRÓXIMOS EVENTOS</div>
        ${upcomingHTML}
      </div>
    </div>
  </div>

  <button class="fab-btn visible" onclick="openEvForm()">+ Nuevo evento</button>`;
}

function setEvView(v){ eventsState.view=v; renderPage(); }
function shiftMonth(d){ eventsState.calMonth+=d; if(eventsState.calMonth>11){eventsState.calMonth=0;eventsState.calYear++;} if(eventsState.calMonth<0){eventsState.calMonth=11;eventsState.calYear--;} renderPage(); }
function openEvForm(){ eventsState.showForm=true; renderPage(); }
function closeEvForm(){ eventsState.showForm=false; renderPage(); }
function calDayClick(dateStr){ eventsState.showForm=true; eventsState.formData.date=dateStr; renderPage(); }
function deleteEvent(id){ eventsState.events=eventsState.events.filter(e=>e.id!==id); renderPage(); }
function saveEvent(){
  const name=(document.getElementById('ef_name')||{}).value||'';
  const date=(document.getElementById('ef_date')||{}).value||'';
  const time=(document.getElementById('ef_time')||{}).value||'00:00';
  const icon=(document.getElementById('ef_icon')||{}).value||'📌';
  if(!name||!date){alert('Nombre y fecha son obligatorios.');return;}
  eventsState.events.push({id:Date.now(),name,date,time,icon,color:'#ff5fd0'});
  eventsState.showForm=false;
  eventsState.formData={name:'',date:'',time:'',icon:'🎂'};
  renderPage();
}

          ${d.forecast.map((f,i)=>{
            const dayDate = new Date(); dayDate.setDate(dayDate.getDate()+i+1);
            return `<div class="forecast-day">
              <div class="f-day">${DAY_NAMES[dayDate.getDay()]}</div>
              <div class="f-icon">${WMO_ICONS[f.code]||'🌡️'}</div>
              <div class="f-temp">${Math.round(f.max)}° / ${Math.round(f.min)}°</div>
            </div>`;
          }).join('')}
        </div>
      </div>` : ''}
    </div>`;
  } else {
    if(s.locError) resultHTML = `<div class="weather-error">📍 ${s.locError}</div>`;
  }
  return `
  <div class="weather-center fadein">
    <div style="text-align:center;margin-bottom:22px;">
      <h1 style="font-size:24px;font-weight:700;font-family:'Space Grotesk',sans-serif;margin:0 0 4px;">❄ Clima</h1>
      <p style="color:var(--text-dim);font-size:13.5px;margin:0;">Tu pronóstico en tiempo real.</p>
    </div>
    <div class="weather-search-row">
      <input class="weather-input" id="wq" value="${s.query}" placeholder="Ciudad..." onkeydown="if(event.key==='Enter')searchWeather()">
      <button class="weather-search-btn" onclick="searchWeather()">Buscar</button>
    </div>
    <button class="weather-loc-btn" onclick="getWeatherByLocation()">📍 Usar mi ubicación</button>
    ${resultHTML}
  </div>`;
}

function searchWeather(){
  const q = (document.getElementById('wq')||{value:weatherState.query}).value.trim();
  if(!q) return;
  weatherState.query = q;
  weatherState.error = null;
  weatherState.locError = null;
  weatherState.loading = true;
  weatherState.data = null;
  renderPage();
  fetchWeatherByCity(q);
}

function getWeatherByLocation(){
  weatherState.loading = true;
  weatherState.error = null;
  weatherState.locError = null;
  weatherState.data = null;
  renderPage();
  if(!navigator.geolocation){
    weatherState.loading = false;
    weatherState.locError = 'Tu navegador no soporta geolocalización.';
    renderPage(); return;
  }
  navigator.geolocation.getCurrentPosition(
    pos => fetchWeatherByCoords(pos.coords.latitude, pos.coords.longitude, null),
    () => {
      weatherState.loading = false;
      weatherState.locError = 'No pudímos acceder a tu ubicación.';
      renderPage();
    }
  );
}

function fetchWeatherByCity(city){
  const geocodeUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=es&format=json`;
  fetch(geocodeUrl)
    .then(r=>r.json())
    .then(res=>{
      if(!res.results||!res.results.length) throw new Error('Ciudad no encontrada.');
      const loc = res.results[0];
      fetchWeatherByCoords(loc.latitude, loc.longitude, loc.name + (loc.country?', '+loc.country:''));
    })
    .catch(e=>{ weatherState.loading=false; weatherState.error=e.message||'Error al buscar la ciudad.'; renderPage(); });
}

function fetchWeatherByCoords(lat, lon, cityName){
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=relativehumidity_2m,apparent_temperature,uv_index&daily=weathercode,temperature_2m_max,temperature_2m_min&windspeed_unit=kmh&timezone=auto&forecast_days=6`;
  fetch(url)
    .then(r=>r.json())
    .then(res=>{
      const cw = res.current_weather;
      const idx = res.hourly.time.findIndex(t=>t.startsWith(cw.time.slice(0,13)));
      const humidity = idx>=0 ? res.hourly.relativehumidity_2m[idx] : '--';
      const feels = idx>=0 ? res.hourly.apparent_temperature[idx] : cw.temperature;
      const uv = idx>=0 ? res.hourly.uv_index[idx] : '--';
      // 5-day forecast (skip today = index 0)
      const forecast = res.daily.time.slice(1,6).map((t,i)=>({ code: res.daily.weathercode[i+1], max: res.daily.temperature_2m_max[i+1], min: res.daily.temperature_2m_min[i+1] }));
      // Reverse-geocode city name if not provided
      if(!cityName){
        fetch(`https://geocoding-api.open-meteo.com/v1/reverse?latitude=${lat}&longitude=${lon}&language=es&format=json`)
          .then(r=>r.json())
          .then(g=>{ cityName = g.results&&g.results[0] ? g.results[0].name : `${lat.toFixed(2)}, ${lon.toFixed(2)}`; setWeatherData(cw, feels, humidity, uv, forecast, cityName); })
          .catch(()=>{ setWeatherData(cw, feels, humidity, uv, forecast, `${lat.toFixed(2)}, ${lon.toFixed(2)}`); });
      } else {
        setWeatherData(cw, feels, humidity, uv, forecast, cityName);
      }
    })
    .catch(e=>{ weatherState.loading=false; weatherState.error='Error al conectar con el servicio de clima.'; renderPage(); });
}

function setWeatherData(cw, feels, humidity, uv, forecast, city){
  weatherState.loading = false;
  weatherState.data = { temp: cw.temperature, weathercode: cw.weathercode, wind: cw.windspeed, feels_like: feels, humidity, uv: typeof uv==='number'?uv.toFixed(1):uv, forecast, city };
  renderPage();
}

function renderPlaceholderModule(id){
  const item = NAV_ITEMS.find(n=>n.id===id);
  const name = item ? item.label : id;
  const icon = item ? item.icon : '📌';
  return `
  <div class="fadein" style="max-width:560px;margin:40px auto;text-align:center;">
    <div class="card-box">
      <div style="font-size:42px;margin-bottom:12px;">${icon}</div>
      <h2 style="font-family:'Space Grotesk';margin:0 0 8px;">Módulo ${name}</h2>
      <p style="color:var(--text-dim);font-size:13.5px;margin:0 0 20px;">Este módulo está activo en MiniAmigixV.</p>
      <button class="hero-btn primary" onclick="navigateTo('home')">← Volver al Inicio</button>
    </div>
  </div>`;
}

/* INIT */
renderNav();
navigateTo('home');
</script>
