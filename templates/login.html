{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - MiniAmigix</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/configuraciones.css' %}">
    <style>
        .auth-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-dark);
        }
        .auth-input {
            width: 100%;
            padding: 10px;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 8px;
        }
    </style>
</head>
<body class="auth-wrapper">
    <div class="config-card">
        <h2 style="text-align: center; margin-bottom: 2rem; font-family: var(--font-title);">LoginPage</h2>
        <form method="POST">
            {% csrf_token %}
            <div class="config-option" style="flex-direction: column; align-items: flex-start; gap: 8px;">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" class="auth-input" required>
            </div>
            <div class="config-option" style="flex-direction: column; align-items: flex-start; gap: 8px;">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" class="auth-input" required>
            </div>
            <div style="text-align: right; margin-top: -10px; margin-bottom: 15px;">
                <a href="{% url 'account_reset_password' %}" style="color: #06b6d4; text-decoration: none; font-size: 0.85rem; font-weight: 500;">¿Olvidaste tu contraseña?</a>
            </div>
            {% if error %}
                <p style="color: #ff4d4d; font-size: 0.9rem; margin-top: 10px; text-align: center;">{{ error }}</p>
            {% endif %}
            <button type="submit">Entrar</button>
        </form>
        <p style="text-align: center; margin-top: 1.5rem; color: var(--text-muted);">
            ¿No tienes cuenta? <a href="{% url 'register' %}" style="color: #7c3aed; text-decoration: none; font-weight: 600;">Regístrate aquí</a>
        </p>
    </div>
</body>
</html>
