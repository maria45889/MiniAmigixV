{% extends "base.html" %}
{% load static %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="dashboard" style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
    <div style="background: var(--panel-dark); padding: 40px; border-radius: 16px; border: 1px solid var(--border-color); max-width: 400px; width: 100%;">
        <h1 style="font-family: var(--font-title); text-align: center; margin-bottom: 2rem;">🔐 Iniciar Sesión</h1>
        
        {% if error %}
        <div style="background: rgba(239, 68, 68, 0.1); color: #ef4444; padding: 10px; border-radius: 8px; margin-bottom: 20px; text-align: center;">
            {{ error }}
        </div>
        {% endif %}
        
        <form method="post">
            {% csrf_token %}
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 8px; color: var(--text-main);">Usuario</label>
                <input type="text" name="username" required style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--panel-dark); color: var(--text-main);">
            </div>
            
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 8px; color: var(--text-main);">Contraseña</label>
                <input type="password" name="password" required style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--panel-dark); color: var(--text-main);">
            </div>
            
            <button type="submit" style="width: 100%; padding: 12px; background: var(--accent-gradient); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">Iniciar Sesión</button>
        </form>
        
        <p style="text-align: center; margin-top: 20px; color: var(--text-muted); font-size: 0.9rem;">
            ¿No tienes cuenta? <a href="{% url 'register' %}" style="color: #7c3aed;">Regístrate</a>
        </p>
    </div>
</div>
{% endblock %}
