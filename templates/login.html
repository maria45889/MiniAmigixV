{% load static %}
{% load socialaccount %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - MiniAmigixV</title>
    <!-- Favicon -->
    <link rel="icon" href="{% static 'imagenes/logo_square.png' %}" type="image/png">
    <link rel="shortcut icon" href="{% static 'imagenes/logo_square.png' %}" type="image/png">
    <link rel="stylesheet" href="{% static 'css/core/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/modules/configuraciones.css' %}">
    <link rel="stylesheet" href="{% static 'css/core/sidebar-neon.css' %}">
    <link rel="stylesheet" href="{% static 'css/core/accounts.css' %}">
    <style>
        .auth-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at top, rgba(124, 58, 237, 0.16), transparent 35%),
                        linear-gradient(180deg, #020617 0%, #09090f 100%);
            padding: 2rem;
        }
        .login-card {
            width: min(450px, 100%);
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
            border-radius: 28px;
            padding: 2.2rem 2.2rem 2.6rem;
            backdrop-filter: blur(20px);
            color: var(--text-main);
        }
        .login-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.9rem;
            margin-bottom: 1.6rem;
        }
        .login-brand img {
            width: 120px;
            height: auto;
            border-radius: 12px;
            filter: drop-shadow(0 0 15px rgba(124, 58, 237, 0.5));
        }
        .login-brand h1 {
            font-family: var(--font-title);
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin: 0;
            color: #fff;
            text-shadow: 
                0 0 10px rgba(124, 58, 237, 0.8),
                0 0 20px rgba(124, 58, 237, 0.6),
                0 0 30px rgba(124, 58, 237, 0.4),
                0 0 40px rgba(6, 182, 212, 0.3);
            animation: neonPulse 3s ease-in-out infinite alternate;
        }
        .login-card h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            font-family: var(--font-title);
            font-size: 1.8rem;
            color: #f8fafc;
        }
        .auth-input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-main);
            border-radius: 14px;
            transition: all 0.2s ease;
        }
        .auth-input:focus {
            outline: none;
            border-color: rgba(124, 58, 237, 0.6);
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.12);
            background: rgba(255,255,255,0.08);
        }
        .login-field {
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
            margin-bottom: 1.2rem;
        }
        .login-field label {
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 500;
        }
        .login-helpers {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.4rem;
        }
        .login-helpers a {
            color: #06b6d4;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .login-action {
            width: 100%;
            padding: 14px 16px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .login-action:hover {
            transform: translateY(-1px);
            box-shadow: 0 16px 32px rgba(124, 58, 237, 0.2);
        }
        .login-footer {
            text-align: center;
            margin-top: 1.6rem;
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        .login-footer a {
            color: #7c3aed;
            text-decoration: none;
            font-weight: 700;
        }
        .login-error {
            color: #fb7185;
            text-align: center;
            margin-bottom: 1rem;
            font-size: 0.95rem;
        }
        .separator {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .separator::before, .separator::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .separator:not(:empty)::before {
            margin-right: .5em;
        }
        .separator:not(:empty)::after {
            margin-left: .5em;
        }
        
        /* Fix auto-fill styles to blend with dark mode */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px #1e293b inset !important;
            -webkit-text-fill-color: white !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        @media (max-width: 520px) {
            .login-card { padding: 1.8rem 1.5rem 2rem; }
            .login-brand { flex-direction: column; gap: 0.6rem; }
        }
    </style>
</head>
<body class="auth-wrapper">
    <div class="login-card">
        <div class="login-brand">
            <img src="{% static 'imagenes/logo.png' %}" alt="MiniAmigixV Logo">
            <h1>MiniAmigixV</h1>
        </div>
        <h2>Bienvenido de nuevo</h2>
        <form method="POST">
            {% csrf_token %}
            <div class="login-field">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" class="auth-input" autocomplete="username" required>
            </div>
            <div class="login-field">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" class="auth-input" autocomplete="current-password" required>
            </div>
            <div style="text-align: right; margin-top: -10px; margin-bottom: 15px;">
                <a href="{% url 'account_reset_password' %}" style="color: #06b6d4; text-decoration: none; font-size: 0.85rem; font-weight: 500;">¿Olvidaste tu contraseña?</a>
            </div>
            {% if error %}
                <p class="login-error">{{ error }}</p>
            {% endif %}
            <button class="login-action" type="submit">Entrar</button>
        </form>

        <p class="login-footer">
            ¿No tienes cuenta? <a href="{% url 'register' %}">Regístrate aquí</a>
        </p>
    </div>
</body>
</html>
