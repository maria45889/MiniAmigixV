{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniAmigixV - {% block title %}Bienvenido{% endblock %}</title>
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#7c3aed">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MiniAmigixV">
    <meta name="description" content="MiniAmigixV - Tu espacio personal interactivo con IA, música, juegos y más">
    <meta name="application-name" content="MiniAmigixV">
    <!-- Favicon -->
    <link rel="icon" href="{% static 'imagenes/logo_square.png' %}" type="image/png">
    <link rel="shortcut icon" href="{% static 'imagenes/logo_square.png' %}" type="image/png">
    <!-- PWA Manifest -->
    <link rel="manifest" href="{% static 'manifest.json' %}">
    <!-- Fuentes: Syne para títulos, Inter para UI -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Syne:wght@700&display=swap" rel="stylesheet">
    <!-- Iconos: Lucide (Se recomienda descargar y servir localmente para evitar 'Tracking Prevention') -->
    <script src="https://unpkg.com/lucide@0.400.0/dist/umd/lucide.min.js" id="lucide-cdn-script" defer onerror="loadLucideFallback()"></script>
    <!-- Iconos: Tabler (Nuevo diseño) -->
    <link rel="stylesheet" href="{% static 'css/fonts/tabler-icons.min.css' %}">
    <!-- CSS Principal -->
    <link rel="stylesheet" href="{% static 'css/core/style-improved.css' %}?v=1">
    <!-- CSS Sidebar con Efecto Neon -->
    <link rel="stylesheet" href="{% static 'css/core/sidebar-neon-improved.css' %}?v=1">
    <!-- CSS Navbar Mejorado -->
    <link rel="stylesheet" href="{% static 'css/core/navbar-improved.css' %}?v=1">
    <style>
        i[data-lucide], .ti {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
        }
        i[data-lucide] svg {
            width: 1em;
            height: 1em;
        }
        /* Estilos para la cajita de sugerencias flotante */
        .suggestion-float {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 300px;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            z-index: 9999;
            overflow: hidden;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
        }
        .suggestion-float:hover {
            box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 20px rgba(124, 58, 237, 0.2);
            border-color: rgba(124, 58, 237, 0.4);
        }
        .suggestion-header {
            background: rgba(0, 0, 0, 0.2);
            color: #fff;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            cursor: move;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .suggestion-header span:first-child {
            display: flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #a78bfa, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .suggestion-body {
            padding: 18px;
            display: none;
            background: rgba(0, 0, 0, 0.1);
        }
        .suggestion-body textarea {
            width: 100%;
            height: 110px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: white;
            padding: 12px;
            resize: none;
            margin-bottom: 12px;
            font-family: inherit;
            transition: all 0.3s ease;
        }
        .suggestion-body textarea:focus {
            outline: none;
            border-color: #8b5cf6;
            background: rgba(0,0,0,0.5);
            box-shadow: inset 0 0 0 1px rgba(139, 92, 246, 0.5);
        }
        .suggestion-btn {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .suggestion-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(124, 58, 237, 0.4);
        }
        .suggestion-btn:active {
            transform: translateY(0);
        }

        .music-float-btn {
            position: fixed;
            bottom: 25px;
            right: 280px; /* A la izquierda de la caja de sugerencias */
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.9), rgba(6, 182, 212, 0.9));
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            z-index: 999;
            transition: transform 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .music-float-btn:hover {
            transform: scale(1.1) rotate(10deg);
            box-shadow: 0 6px 20px rgba(6, 182, 212, 0.6);
        }
        .music-float-btn.spinning span {
            display: inline-block;
            animation: musicFloatSpin 3s linear infinite;
        }
        @keyframes musicFloatSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* En móviles, ajustar la posición */
        @media (max-width: 768px) {
            .music-float-btn {
                right: 20px;
                bottom: 80px; /* Arriba del menú inferior o caja de sugerencias si están */
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="app-layout">
        {% include "includes/sidebar.html" %}
        <main class="main-content">
            {% include "includes/navbar.html" %}
            <div class="page-content">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <!-- Caja de Sugerencias Flotante -->
    <div id="quick-suggestion" class="suggestion-float">

            <span>💡 Sugerencias</span>
            <span id="suggestion-icon"><i class="ti ti-chevron-up"></i></span>
        </div>
        <div class="suggestion-body" id="suggestion-body">
            <textarea id="suggestion-content-text" placeholder="¿Cómo podemos mejorar MiniAmigixV?"></textarea>
            <button class="suggestion-btn" onclick="sendQuickSuggestion()">Enviar al Admin</button>
        </div>
    </div>

    <!-- Global Mini Player Flotante -->
    <div id="music-float-btn" class="music-float-btn" style="display: none;" title="Abrir Reproductor">
        <span style="font-size: 20px;">🎵</span>
    </div>

    <div id="mini-player" class="floating-mini-player" style="display: none;">
        <div class="mini-player-header" id="mini-player-header" title="Arrástrame para mover el reproductor">
            <div class="mini-player-song-info">
                <div class="mini-player-vinyl" id="mini-player-vinyl"></div>
                <div style="min-width: 0; flex: 1;">
                    <div class="mini-player-title" id="mini-player-title">Sin reproducción</div>
                    <div class="mini-player-artist" id="mini-player-artist"></div>
                </div>
            </div>
            <div class="mini-player-header-btns">
                <button class="btn-mini" onclick="toggleMiniPlayerVideo()" id="mini-video-btn" title="🎬 Ver video en mini reproductor">👁️</button>
                <button class="btn-mini minimize-btn" onclick="toggleMiniPlayer()" title="Minimizar">−</button>
            </div>
        </div>
        <div class="mini-player-body">
            <div id="mini-player-video-container" style="display: none; width: 100%; height: 180px; background: #000; margin-bottom: 10px; border-radius: 8px; overflow: hidden; position: relative; z-index: 0;">
                <div id="mini-youtube-iframe"></div>
            </div>
            <div class="mini-player-progress">
                <div class="mini-player-progress-bar" id="mini-progress-bar"></div>
            </div>
            <div class="mini-player-controls">
                <button class="btn-mini" id="mini-prev-btn" title="Anterior">⏮</button>
                <button class="btn-mini play" id="mini-play-btn" title="Reproducir/Pausar">▶</button>
                <button class="btn-mini" id="mini-next-btn" title="Siguiente">⏭</button>
                <button class="btn-mini" id="mini-mute-btn" title="Silenciar">🔊</button>
            </div>
        </div>
    </div>

    <!-- Inicializar Iconos -->
    <script>
        function loadLucideFallback() {
            const script = document.createElement('script');
            script.src = '{% static "js/lucide.min.js" %}';
            script.onload = initIcons;
            document.head.appendChild(script);
        }

        function initIcons() {
            if (typeof lucide !== 'undefined' && document.querySelectorAll('i[data-lucide]').length > 0) {
                lucide.createIcons({
                    attributes: {
                        'stroke-width': 1.8,
                        'color': 'currentColor'
                    }
                });
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initIcons);
        } else {
            requestAnimationFrame(initIcons);
        }

        // Registrar Service Worker para PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/static/js/service-worker.js')
                    .then(function(registration) {
                        console.log('Service Worker registrado con éxito:', registration.scope);
                    })
                    .catch(function(error) {
                        console.log('Error al registrar Service Worker:', error);
                    });
            });
        }

        // Botón de instalación PWA
        let deferredPrompt;
        const installHeroBtn = document.getElementById('pwa-install-hero');
        
        window.addEventListener('beforeinstallprompt', (e) => {
            if (!installHeroBtn) return;

            e.preventDefault();
            deferredPrompt = e;
            installHeroBtn.style.display = 'inline-flex';
        });

        if (installHeroBtn) {
            installHeroBtn.addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') {
                        console.log('Usuario aceptó la instalación');
                    }
                    deferredPrompt = null;
                    installHeroBtn.style.display = 'none';
                }
            });
        }

        window.addEventListener('appinstalled', () => {
            console.log('PWA instalada');
            if (installHeroBtn) {
                installHeroBtn.style.display = 'none';
            }
        });
    </script>
    <script>
        // ==================== SUGGESTION BOX ====================
        let hasMoved = false;

        function toggleSuggestion() {
            if (hasMoved) return;

            const body = document.getElementById('suggestion-body');
            const icon = document.getElementById('suggestion-icon');
            if (body.style.display === 'none' || body.style.display === '') {
                body.style.display = 'block';
                icon.innerHTML = '<i class="ti ti-x"></i>';
            } else {
                body.style.display = 'none';
                icon.innerHTML = '<i class="ti ti-chevron-up"></i>';
            }
        }

        function makeDraggable(elmnt) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            let hasMoved = false;
            // Si el elemento tiene un header, usamos el header para arrastrar, sino, el propio elemento.
            let header = elmnt.querySelector('.suggestion-header');
            if (!header) header = elmnt;

            // Prevenir el comportamiento por defecto de "arrastrar imagen/enlace" del navegador
            header.ondragstart = function() { return false; };

            header.onmousedown = dragMouseDown;
            header.ontouchstart = dragMouseDown;

            function dragMouseDown(e) {
                e = e || window.event;
                if (e.type !== 'touchstart') {
                    e.preventDefault(); // Prevent text selection drag
                }
                hasMoved = false;
                
                const clientX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
                const clientY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
                
                pos3 = clientX;
                pos4 = clientY;
                
                document.onmouseup = closeDragElement;
                document.ontouchend = closeDragElement;
                document.onmousemove = elementDrag;
                document.ontouchmove = elementDrag;
            }

            function elementDrag(e) {
                e = e || window.event;
                // e.preventDefault(); // Omitido para permitir scroll si es necesario
                const clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
                const clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
                
                if (Math.abs(pos3 - clientX) > 5 || Math.abs(pos4 - clientY) > 5) {
                    hasMoved = true;
                }
                
                pos1 = pos3 - clientX;
                pos2 = pos4 - clientY;
                pos3 = clientX;
                pos4 = clientY;
                
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
                elmnt.style.bottom = "auto";
                elmnt.style.right = "auto";
            }

            function closeDragElement(e) {
                document.onmouseup = null;
                document.ontouchend = null;
                document.onmousemove = null;
                document.ontouchmove = null;
                
                if (!hasMoved) {
                    if (elmnt.id === 'quick-suggestion' && typeof toggleSuggestion === 'function') {
                        toggleSuggestion();
                    } else if (elmnt.id === 'music-float-btn' && typeof toggleMiniPlayer === 'function') {
                        toggleMiniPlayer();
                    }
                }
            }
        }

        function sendQuickSuggestion() {
            const text = document.getElementById('suggestion-content-text').value;
            if (!text.trim()) {
                alert("Por favor escribe algo antes de enviar.");
                return;
            }

            fetch('/api/sugerencia-rapida/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({ contenido: text })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    let msg = "¡Gracias! Tu sugerencia ha sido guardada.";
                    if (data.guardada_en === 'bd_y_email') {
                        msg = "¡Gracias! Tu sugerencia ha sido enviada al administrador por email." + (data.email_error ? " (con respaldo en BD)" : "");
                    } else if (data.email_error) {
                        msg += " El email al administrador falló: " + data.email_error;
                    }
                    alert(msg);
                    document.getElementById('suggestion-content-text').value = '';
                    toggleSuggestion();
                } else {
                    alert("❌ Error al enviar el mensaje. " + data.error);
                }
            })
            .catch(error => {
                console.error('Error:', error);
            });
        }

        function toggleTheme() {
            document.body.classList.toggle("light");
            const isLight = document.body.classList.contains("light");
            localStorage.setItem("theme", isLight ? "light" : "dark");
            
            // Update theme icon in navbar
            const themeIcon = document.querySelector('.theme-btn i');
            if (themeIcon) {
                themeIcon.setAttribute('data-lucide', isLight ? 'sun' : 'moon');
                if (typeof lucide !== 'undefined') {
                    lucide.createIcons();
                }
            }
            
            // Update Tabler icons
            const tablerIcon = document.querySelector('.theme-btn .ti');
            if (tablerIcon) {
                tablerIcon.className = isLight ? 'ti ti-sun' : 'ti ti-moon';
            }
            
            // Guardar tema en la base de datos si el usuario está autenticado
            if (typeof fetch !== 'undefined') {
                fetch('/api/update-theme/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({ tema: isLight ? 'light' : 'dark' })
                }).catch(err => console.error('Error al guardar tema:', err));
            }
        }

        // Aplicar tema guardado - Prioridad: base de datos > localStorage > dark
        function applyTheme() {
            const localStorageTheme = localStorage.getItem("theme");
            const dbTheme = "{{ perfil_tema|default:'dark' }}";
            {% if user.is_authenticated %}
            // Para usuarios autenticados, la BD es la fuente de verdad
            const defaultTheme = dbTheme;
            localStorage.setItem('theme', dbTheme);
            {% else %}
            const defaultTheme = localStorageTheme || dbTheme || 'dark';
            {% endif %}
            
            if (defaultTheme === "light") {
                document.body.classList.add("light");
            } else {
                document.body.classList.remove("light");
            }
            
            // Update icons
            const isLight = document.body.classList.contains("light");
            const lucideIcon = document.querySelector('.theme-btn i');
            if (lucideIcon) {
                lucideIcon.setAttribute('data-lucide', isLight ? 'sun' : 'moon');
                if (typeof lucide !== 'undefined') {
                    lucide.createIcons();
                }
            }
            
            const tablerIcon = document.querySelector('.theme-btn .ti');
            if (tablerIcon) {
                tablerIcon.className = isLight ? 'ti ti-sun' : 'ti ti-moon';
            }
        }
        
        // Aplicar tema inmediatamente
        applyTheme();

        // Sistema de traducciones
        const translations = {
            es: {
                'home': 'Inicio',
                'chat': 'Chat IA',
                'music': 'Música',
                'blog': 'Blog',
                'games': 'Juegos',
                'study': 'Estudio',
                'events': 'Eventos',
                'weather': 'Clima',
                'translator': 'Traductor',
                'entertainment': 'Entretenimiento',
                'support': 'Soporte',
                'admin': 'Centro de Administración General',
                'profile': 'Perfil',
                'settings': 'Configuración',
                'logout': 'Cerrar Sesión',
                'login': 'Iniciar Sesión',
                'register': 'Registrarse'
            },
            en: {
                'home': 'Home',
                'chat': 'Chat AI',
                'music': 'Music',
                'blog': 'Blog',
                'games': 'Games',
                'study': 'Study',
                'events': 'Events',
                'weather': 'Weather',
                'translator': 'Translator',
                'entertainment': 'Entertainment',
                'support': 'Support',
                'admin': 'General Admin Center',
                'profile': 'Profile',
                'settings': 'Settings',
                'logout': 'Logout',
                'login': 'Login',
                'register': 'Register'
            }
        };

        function applyLanguage(lang) {
            const currentLang = translations[lang] || translations['es'];
            // Aplicar traducciones a elementos con data-i18n
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (currentLang[key]) {
                    el.textContent = currentLang[key];
                }
            });
            localStorage.setItem('idioma', lang);
        }

        // Aplicar idioma guardado - Prioridad: base de datos > localStorage > 'es'
        const dbLang = "{{ perfil_idioma|default:'es' }}";
        const localLang = localStorage.getItem('idioma');
        // Si el usuario está autenticado, usar el valor de la BD como fuente de verdad
        {% if user.is_authenticated %}
        const savedLang = dbLang;
        // Sincronizar localStorage con el valor de la BD
        localStorage.setItem('idioma', dbLang);
        {% else %}
        const savedLang = localLang || dbLang;
        {% endif %}
        applyLanguage(savedLang);


        // Inicializar drag para la caja de sugerencias (sin forzar posición estática inicial)
        const suggestBox = document.getElementById("quick-suggestion");
        if (suggestBox) {
            makeDraggable(suggestBox);
        }

        // Inicializar drag para el botón flotante de música
        const musicFloatBtnDrag = document.getElementById("music-float-btn");
        if (musicFloatBtnDrag) {
            makeDraggable(musicFloatBtnDrag);
        }

        // --- getCookie global ---
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.startsWith(name + "=")) {
                        cookieValue = decodeURIComponent(cookie.split("=")[1]);
                        break;
                    }
                }
            }
            return cookieValue;
        }

        // ==================== GLOBAL MINI PLAYER ====================
        // Suprimir advertencia de postMessage de YouTube en localhost
        const originalError = console.error;
        console.error = function(...args) {
            if (typeof args[0] === 'string' && args[0].includes('postMessage') && args[0].includes('target origin')) {
                return; // Ignorar advertencia de origen en localhost
            }
            originalError.apply(console, args);
        };

        // Interceptar errores de ventana para postMessage
        const originalOnErrorHandler = window.onerror;
        window.onerror = function(message, source, lineno, colno, error) {
            if (typeof message === 'string' && message.includes('postMessage') && message.includes('target origin')) {
                return true; // Prevenir que el error se muestre en consola
            }
            if (originalOnErrorHandler) {
                return originalOnErrorHandler(message, source, lineno, colno, error);
            }
            return false;
        };

        // Capturar errores globales del iframe de YouTube y su postMessage interno
        window.addEventListener('error', function(event) {
            if (event && event.message && event.message.includes('postMessage') && event.message.includes('target origin')) {
                event.preventDefault();
                return false;
            }
        });

        // Cargar YouTube IFrame API para el mini player una sola vez
        if (!window.YT && !document.querySelector('script[src="https://www.youtube.com/iframe_api"]')) {
            var tag = document.createElement('script');
            tag.src = "https://www.youtube.com/iframe_api";
            tag.async = true;
            var firstScriptTag = document.getElementsByTagName('script')[0];
            firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
        }

        let globalPlayer = null;
        let globalCurrentYoutubeId = null;
        let globalCurrentSongName = '';
        let globalCurrentArtist = '';
        let globalIsPaused = false;

        // Función callback cuando la API de YouTube está lista
        window.onYouTubeIframeAPIReady = function() {
            // Si hay un ID de YouTube cargado, inicializar el reproductor
            if (globalCurrentYoutubeId) {
                const videoContainer = document.getElementById('mini-player-video-container');
                if (videoContainer && videoContainer.style.display !== 'none') {
                    createMiniPlayerVideo(globalCurrentYoutubeId);
                }
            }
        };

        function createMiniPlayerVideo(youtubeId) {
            if (!youtubeId) return;

            const iframeContainer = document.getElementById('mini-youtube-iframe');
            if (!iframeContainer) return;

            if (!window.YT || !YT.Player) {
                // Si la API de YouTube aún no está lista, cargarla y esperar al callback
                if (!document.querySelector('script[src="https://www.youtube.com/iframe_api"]')) {
                    const tag = document.createElement('script');
                    tag.src = 'https://www.youtube.com/iframe_api';
                    tag.async = true;
                    const firstScriptTag = document.getElementsByTagName('script')[0];
                    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
                }

                iframeContainer.innerHTML = '<p style="color: var(--text-muted);">Cargando mini reproductor...</p>';
                globalCurrentYoutubeId = youtubeId;
                return;
            }

            if (globalPlayer) {
                globalPlayer.destroy();
            }

            globalPlayer = new YT.Player('mini-youtube-iframe', {
                height: '200',
                width: '100%',
                videoId: youtubeId,
                host: 'https://www.youtube.com',
                playerVars: {
                    'autoplay': 1,
                    'rel': 0,
                    'modestbranding': 1,
                    'playsinline': 1,
                    'origin': window.location.origin
                },
                events: {
                    'onStateChange': function(event) {
                        if (event.data === YT.PlayerState.PLAYING) {
                            updateMiniPlayerPlayButton(true);
                            localStorage.setItem('miniPlayerWasPlaying', 'true');
                        } else if (event.data === YT.PlayerState.PAUSED) {
                            updateMiniPlayerPlayButton(false);
                            localStorage.setItem('miniPlayerWasPlaying', 'false');
                            // Guardar tiempo actual al pausar
                            if (globalPlayer && typeof globalPlayer.getCurrentTime === 'function') {
                                localStorage.setItem('miniPlayerCurrentTime', globalPlayer.getCurrentTime().toString());
                            }
                        } else if (event.data === YT.PlayerState.ENDED) {
                            updateMiniPlayerPlayButton(false);
                            localStorage.setItem('miniPlayerWasPlaying', 'false');
                        }
                    },
                    'onError': function(event) {
                        console.error('Error en mini player YouTube:', event.data);
                    }
                }
            });
        }

        // Drag variables for mini player
        let mpDragging = false;
        let mpCurrentX, mpCurrentY, mpInitialX, mpInitialY;
        let mpXOffset = 0, mpYOffset = 0;
        let miniPlayerEl = null;
        let miniPlayerHeaderEl = null;
        let miniPlayerDragFrame = null;

        function toggleMiniPlayer() {
            const mp = document.getElementById('mini-player');
            const floatBtn = document.getElementById('music-float-btn');
            const videoContainer = document.getElementById('mini-player-video-container');
            const videoBtn = document.getElementById('mini-video-btn');
            if (!mp) return;
            
            if (mp.style.display === 'none' || !mp.style.display) {
                mp.style.display = 'block';
                if (floatBtn) floatBtn.style.display = 'none';
                localStorage.setItem('miniPlayerVisible', 'true');

                if (globalCurrentYoutubeId) {
                    if (videoContainer) {
                        videoContainer.style.display = 'block';
                    }
                    if (videoBtn) {
                        videoBtn.textContent = '👁️‍🗨️';
                    }
                    createMiniPlayerVideo(globalCurrentYoutubeId);
                }
            } else {
                mp.style.display = 'none';
                if (floatBtn) floatBtn.style.display = 'flex';
                localStorage.setItem('miniPlayerVisible', 'false');
            }
        }

        function initMiniPlayerDrag() {
            miniPlayerEl = document.getElementById('mini-player');
            miniPlayerHeaderEl = document.getElementById('mini-player-header');
            if (!miniPlayerEl || !miniPlayerHeaderEl) return;

            miniPlayerHeaderEl.addEventListener('mousedown', mpDragStart);
            miniPlayerHeaderEl.addEventListener('touchstart', mpDragStart, { passive: false });
            document.addEventListener('mousemove', mpDrag);
            document.addEventListener('touchmove', mpDrag, { passive: false });
            document.addEventListener('mouseup', mpDragEnd);
            document.addEventListener('touchend', mpDragEnd);
        }

        function mpDragStart(e) {
            const mp = miniPlayerEl || document.getElementById('mini-player');
            if (!mp || mp.style.display === 'none') return;

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            mpInitialX = clientX - mpXOffset;
            mpInitialY = clientY - mpYOffset;
            const target = e.target;
            const header = miniPlayerHeaderEl || document.getElementById('mini-player-header');
            if (target === header || header.contains(target)) {
                if (target.tagName === 'BUTTON' || target.closest('button')) return;
                mpDragging = true;
            }
        }

        function mpDrag(e) {
            if (!mpDragging) return;
            e.preventDefault();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            mpCurrentX = clientX - mpInitialX;
            mpCurrentY = clientY - mpInitialY;
            mpXOffset = mpCurrentX;
            mpYOffset = mpCurrentY;

            if (!miniPlayerDragFrame) {
                miniPlayerDragFrame = requestAnimationFrame(function() {
                    if (miniPlayerEl) {
                        miniPlayerEl.style.transform = `translate3d(${mpXOffset}px, ${mpYOffset}px, 0)`;
                    }
                    miniPlayerDragFrame = null;
                });
            }
        }

        function mpDragEnd() {
            mpInitialX = mpCurrentX;
            mpInitialY = mpCurrentY;
            mpDragging = false;
        }

        // Controles del mini player
        window.globalTogglePause = function() {
            const videoContainer = document.getElementById('mini-player-video-container');

            // Si el video está visible en el mini player, controlar el video del mini player
            if (videoContainer && videoContainer.style.display !== 'none' && globalPlayer) {
                try {
                    if (globalPlayer.getPlayerState() === YT.PlayerState.PLAYING) {
                        globalPlayer.pauseVideo();
                        updateMiniPlayerPlayButton(false);
                        localStorage.setItem('miniPlayerWasPlaying', 'false');
                    } else {
                        globalPlayer.playVideo();
                        updateMiniPlayerPlayButton(true);
                        localStorage.setItem('miniPlayerWasPlaying', 'true');
                    }
                } catch (e) {
                    console.error('Error controlando video del mini player:', e);
                }
            } else {
                // Si no, controlar el reproductor principal
                if (typeof togglePause === 'function') {
                    togglePause();
                }
            }
        };

        window.globalPlayNext = function() {
            if (typeof playNext === 'function') {
                playNext();
            }
        };

        window.globalPlayPrevious = function() {
            if (typeof playPrevious === 'function') {
                playPrevious();
            }
        };

        window.globalToggleMute = function() {
            const videoContainer = document.getElementById('mini-player-video-container');

            // Si el video está visible en el mini player, controlar el video del mini player
            if (videoContainer && videoContainer.style.display !== 'none' && globalPlayer) {
                try {
                    if (globalPlayer.isMuted()) {
                        globalPlayer.unMute();
                        document.getElementById('mini-mute-btn').textContent = '🔊';
                    } else {
                        globalPlayer.mute();
                        document.getElementById('mini-mute-btn').textContent = '🔇';
                    }
                } catch (e) {
                    console.error('Error controlando mute del mini player:', e);
                }
            } else {
                // Si no, controlar el reproductor principal
                if (typeof toggleMute === 'function') {
                    toggleMute();
                }
            }
        };

        window.toggleMiniPlayerVideo = function() {
            const videoContainer = document.getElementById('mini-player-video-container');
            const videoBtn = document.getElementById('mini-video-btn');

            if (!videoContainer) return;

            if (videoContainer.style.display === 'none') {
                // Mostrar video
                videoContainer.style.display = 'block';
                if (videoBtn) videoBtn.textContent = '👁️‍🗨️';

                // Crear reproductor de YouTube si hay un ID de video
                if (globalCurrentYoutubeId) {
                    createMiniPlayerVideo(globalCurrentYoutubeId);
                } else {
                    console.log('No hay ID de YouTube para mostrar video');
                }
            } else {
                // Ocultar video
                videoContainer.style.display = 'none';
                if (videoBtn) videoBtn.textContent = '👁️';
            }
        };

        // Sincronizar mini player con el reproductor principal
        function updateMiniPlayerUI(songName, artist, youtubeId, isPlaying = false, currentTime = 0) {
            const titleEl = document.getElementById('mini-player-title');
            const artistEl = document.getElementById('mini-player-artist');
            const mp = document.getElementById('mini-player');
            const floatBtn = document.getElementById('music-float-btn');

            if (titleEl) titleEl.textContent = songName || 'Sin reproducción';
            if (artistEl) artistEl.textContent = artist || '';

            // NO mostrar automáticamente el mini player - el usuario debe activarlo
            // Solo mostrar el botón flotante para que el usuario sepa que hay música
            if (floatBtn) floatBtn.style.display = 'flex';

            // Guardar estado en localStorage pero NO mostrar automáticamente
            localStorage.setItem('miniPlayerSong', songName || '');
            localStorage.setItem('miniPlayerArtist', artist || '');
            localStorage.setItem('miniPlayerYoutubeId', youtubeId || '');
            localStorage.setItem('miniPlayerVisible', 'false'); // Siempre false al iniciar
            localStorage.setItem('miniPlayerWasPlaying', isPlaying ? 'true' : 'false');
            localStorage.setItem('miniPlayerCurrentTime', currentTime.toString());
        }

        function updateMiniPlayerPlayButton(isPlaying) {
            const playBtn = document.getElementById('mini-play-btn');
            if (playBtn) {
                playBtn.textContent = isPlaying ? '⏸' : '▶';
            }
            const vinyl = document.getElementById('mini-player-vinyl');
            if (vinyl) {
                if (isPlaying) {
                    vinyl.classList.add('spinning');
                } else {
                    vinyl.classList.remove('spinning');
                }
            }
            const floatBtn = document.getElementById('music-float-btn');
            if (floatBtn) {
                if (isPlaying) {
                    floatBtn.classList.add('spinning');
                } else {
                    floatBtn.classList.remove('spinning');
                }
            }
        }

        function updateMiniPlayerProgress(percentage) {
            const bar = document.getElementById('mini-progress-bar');
            if (bar) bar.style.width = percentage + '%';
            
            // Guardar tiempo actual periódicamente
            if (globalPlayer && typeof globalPlayer.getCurrentTime === 'function') {
                const currentTime = globalPlayer.getCurrentTime();
                localStorage.setItem('miniPlayerCurrentTime', currentTime.toString());
            }
        }

        // Inicializar mini player
        document.addEventListener('DOMContentLoaded', function() {
            initMiniPlayerDrag();

            // Restaurar información de la canción si existe
            const savedSong = localStorage.getItem('miniPlayerSong');
            const savedArtist = localStorage.getItem('miniPlayerArtist');
            const savedYoutubeId = localStorage.getItem('miniPlayerYoutubeId');
            const savedVisible = localStorage.getItem('miniPlayerVisible');
            const savedWasPlaying = localStorage.getItem('miniPlayerWasPlaying');
            const savedCurrentTime = localStorage.getItem('miniPlayerCurrentTime');
            const floatBtn = document.getElementById('music-float-btn');

            if (savedSong || savedYoutubeId) {
                const titleEl = document.getElementById('mini-player-title');
                const artistEl = document.getElementById('mini-player-artist');

                if (titleEl) titleEl.textContent = savedSong || 'Sin reproducción';
                if (artistEl) artistEl.textContent = savedArtist || '';
                if (floatBtn) floatBtn.style.display = 'flex';
            }

            if (savedYoutubeId) {
                globalCurrentYoutubeId = savedYoutubeId;

                // Si estaba reproduciendo, restaurar automáticamente
                if (savedWasPlaying === 'true' && savedYoutubeId) {
                    // Esperar a que la API de YouTube esté lista
                    const checkAndRestore = setInterval(() => {
                        if (window.YT && YT.Player) {
                            clearInterval(checkAndRestore);
                            
                            // Mostrar mini player si estaba visible
                            if (savedVisible === 'true') {
                                toggleMiniPlayer();
                            }
                            
                            // Crear reproductor y restaurar reproducción
                            createMiniPlayerVideo(savedYoutubeId);
                            
                            // Esperar a que el reproductor esté listo y luego reproducir
                            setTimeout(() => {
                                if (globalPlayer && typeof globalPlayer.playVideo === 'function') {
                                    globalPlayer.playVideo();
                                    updateMiniPlayerPlayButton(true);
                                    
                                    // Si había un tiempo guardado, buscar a ese punto
                                    if (savedCurrentTime && parseFloat(savedCurrentTime) > 0) {
                                        setTimeout(() => {
                                            globalPlayer.seekTo(parseFloat(savedCurrentTime), true);
                                        }, 500);
                                    }
                                }
                            }, 1000);
                        }
                    }, 100);
                    
                    // Timeout por si la API tarda mucho
                    setTimeout(() => clearInterval(checkAndRestore), 5000);
                }
            }

            if (savedVisible === 'true' && savedWasPlaying !== 'true') {
                toggleMiniPlayer();
            }

            // Agregar event listeners a los botones
            const prevBtn = document.getElementById('mini-prev-btn');
            const playBtn = document.getElementById('mini-play-btn');
            const nextBtn = document.getElementById('mini-next-btn');
            const muteBtn = document.getElementById('mini-mute-btn');

            if (prevBtn) prevBtn.addEventListener('click', globalPlayPrevious);
            if (playBtn) playBtn.addEventListener('click', globalTogglePause);
            if (nextBtn) nextBtn.addEventListener('click', globalPlayNext);
            if (muteBtn) muteBtn.addEventListener('click', globalToggleMute);

            // Botón flotante (El clic ahora se maneja en makeDraggable para evitar conflictos con el arrastre)
            // if (floatBtn) {
            //     floatBtn.addEventListener('click', toggleMiniPlayer);
            // }

            // Guardar estado antes de cambiar de página
            window.addEventListener('beforeunload', function() {
                if (globalPlayer && typeof globalPlayer.getCurrentTime === 'function') {
                    localStorage.setItem('miniPlayerCurrentTime', globalPlayer.getCurrentTime().toString());
                }
            });
        });

        // --- SORTABLE GRIDS GLOBALES ---
        function initDraggableGrids() {
            const grids = document.querySelectorAll(".sortable-grid");

            grids.forEach((grid) => {
                const id = grid.dataset.gridId;

                // Restaurar orden guardado
                const savedOrder = JSON.parse(localStorage.getItem("grid-" + id) || "null");

                if (savedOrder) {
                    savedOrder.forEach(key => {
                        const el = grid.querySelector(`[data-id="${key}"]`);
                        if (el) grid.appendChild(el);
                    });
                }

                // Activar Sortable
                new Sortable(grid, {
                    animation: 150,
                    ghostClass: "dragging",
                    handle: ".nota-card, .cat-card, .dashboard-card", // Elementos arrastrables
                    onEnd: function () {
                        const order = [...grid.children].map(el => el.dataset.id).filter(id => id);
                        localStorage.setItem("grid-" + id, JSON.stringify(order));
                    }
                });
            });
        }

        document.addEventListener("DOMContentLoaded", initDraggableGrids);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <style>
        .dragging {
            opacity: 0.6;
            transform: scale(0.98);
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.5) !important;
            border-color: #7c3aed !important;
            z-index: 9999;
        }
    </style>
    <script>
    (function() {
        var saved = localStorage.getItem('accent_color');
        if (saved) {
            function hexPair(hex) {
                var r = Math.min(255, parseInt(hex.slice(1,3), 16) + 60);
                var g = Math.min(255, parseInt(hex.slice(3,5), 16) + 40);
                var b = Math.min(255, parseInt(hex.slice(5,7), 16) + 60);
                return '#' + [r,g,b].map(function(v) { return v.toString(16).padStart(2,'0'); }).join('');
            }
            document.documentElement.style.setProperty('--primary', saved);
            document.documentElement.style.setProperty('--accent', saved);
            document.documentElement.style.setProperty('--accent-gradient', 'linear-gradient(135deg, ' + saved + ', ' + hexPair(saved) + ')');
        }
    })();
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
