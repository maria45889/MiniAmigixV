{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Correo Enviado - MiniAmigix</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/configuraciones.css' %}">
    <style>
        .auth-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-dark);
            padding: 20px;
        }
    </style>
</head>
<body class="auth-wrapper">
    <div class="config-card" style="max-width: 450px; width: 100%; text-align: center;">
        <div style="font-size: 4rem; margin-bottom: 1rem;">✉️</div>
        
        <h2 style="margin-bottom: 1rem; font-family: var(--font-title); font-size: 1.8rem; background: linear-gradient(135deg, #7c3aed, #06b6d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
            Revisa tu correo
        </h2>
        
        <p style="color: var(--text-muted, #94a3b8); margin-bottom: 2rem; font-size: 0.95rem; line-height: 1.5;">
            Te hemos enviado un correo electrónico con instrucciones para restablecer tu contraseña. Si no lo encuentras en tu bandeja de entrada principal, por favor revisa la carpeta de spam o correo no deseado.
        </p>

        <a href="{% url 'login' %}" style="display: inline-block; width: 100%; padding: 12px; background: rgba(255, 255, 255, 0.1); color: white; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; font-weight: 600; text-decoration: none; transition: background 0.2s;">
            Volver a Iniciar Sesión
        </a>
    </div>
</body>
</html>
