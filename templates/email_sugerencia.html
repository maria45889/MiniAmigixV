<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Sugerencia - MiniAmigixV</title>
    <style>
        body {
            font-family: 'Segoe UI', 'Inter', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 40px 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .card {
            background: #ffffff;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        .header {
            background: linear-gradient(135deg, #7c3aed 0%, #06b6d4 100%);
            padding: 40px 30px;
            text-align: center;
            position: relative;
        }
        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            opacity: 0.3;
        }
        .header-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        .header h1 {
            margin: 0;
            color: #ffffff;
            font-size: 28px;
            font-weight: 700;
            position: relative;
        }
        .header p {
            margin: 8px 0 0;
            color: rgba(255, 255, 255, 0.9);
            font-size: 16px;
            position: relative;
        }
        .content {
            padding: 32px;
        }
        .info-section {
            background: #f8fafc;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid #e2e8f0;
        }
        .info-row {
            display: flex;
            margin-bottom: 12px;
            align-items: center;
        }
        .info-row:last-child {
            margin-bottom: 0;
        }
        .info-label {
            font-weight: 600;
            color: #64748b;
            font-size: 13px;
            min-width: 80px;
        }
        .info-value {
            color: #1e293b;
            font-size: 14px;
        }
        .message-box {
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.05), rgba(6, 182, 212, 0.05));
            border-left: 4px solid #7c3aed;
            padding: 24px;
            border-radius: 0 16px 16px 0;
            margin: 24px 0;
        }
        .message-label {
            font-size: 12px;
            font-weight: 600;
            color: #7c3aed;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }
        .message-text {
            color: #334155;
            font-size: 15px;
            line-height: 1.7;
            margin: 0;
            white-space: pre-wrap;
        }
        .category-badge {
            display: inline-block;
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .footer {
            background: #f1f5f9;
            padding: 24px 32px;
            text-align: center;
            border-top: 1px solid #e2e8f0;
        }
        .footer p {
            margin: 0;
            color: #64748b;
            font-size: 13px;
        }
        .footer a {
            color: #7c3aed;
            text-decoration: none;
            font-weight: 600;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        @media only screen and (max-width: 600px) {
            body {
                padding: 20px 10px;
            }
            .content {
                padding: 24px;
            }
            .header {
                padding: 32px 24px;
            }
            .header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <div class="header-icon">💡</div>
                <h1>Nueva Sugerencia</h1>
                <p>¡Una idea para mejorar MiniAmigixV!</p>
            </div>
            
            <div class="content">
                <div class="info-section">
                    <div class="info-row">
                        <span class="info-label">De:</span>
                        <span class="info-value">{{ nombre }}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Email:</span>
                        <span class="info-value">{{ email }}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Fecha:</span>
                        <span class="info-value">{{ fecha }}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Categoría:</span>
                        <span class="category-badge">{{ categoria }}</span>
                    </div>
                </div>
                
                <div class="message-box">
                    <div class="message-label">Sugerencia</div>
                    <p class="message-text">{{ mensaje }}</p>
                </div>
            </div>
            
            <div class="footer">
                <p>© 2026 MiniAmigixV - Sistema de Sugerencias</p>
                <p style="margin-top: 8px; font-size: 11px; color: #94a3b8;">
                    Este mensaje fue enviado automáticamente desde el formulario de sugerencias
                </p>
            </div>
        </div>
    </div>
</body>
</html>
