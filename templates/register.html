{% load static %}
{% load socialaccount %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - MiniAmigixV</title>
    <!-- Favicon -->
    <link rel="icon" href="{% static 'imagenes/logo_square.png' %}" type="image/png">
    <link rel="shortcut icon" href="{% static 'imagenes/logo_square.png' %}" type="image/png">
    <link rel="stylesheet" href="{% static 'css/core/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/modules/configuraciones.css' %}">
    <link rel="stylesheet" href="{% static 'css/core/sidebar-neon.css' %}">
    <style>
        .auth-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at top, rgba(124, 58, 237, 0.16), transparent 35%),
                        linear-gradient(180deg, #020617 0%, #09090f 100%);
            padding: 2rem;
        }
        .login-card {
            width: min(450px, 100%);
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
            border-radius: 28px;
            padding: 2.2rem 2.2rem 2.6rem;
            backdrop-filter: blur(20px);
            color: var(--text-main);
        }
        .login-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.9rem;
            margin-bottom: 1.6rem;
        }
        .login-brand img {
            width: 120px;
            height: auto;
            border-radius: 12px;
            filter: drop-shadow(0 0 15px rgba(124, 58, 237, 0.5));
        }
        .login-brand h1 {
            font-family: var(--font-title);
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin: 0;
            color: #fff;
            text-shadow: 
                0 0 10px rgba(124, 58, 237, 0.8),
                0 0 20px rgba(124, 58, 237, 0.6),
                0 0 30px rgba(124, 58, 237, 0.4),
                0 0 40px rgba(6, 182, 212, 0.3);
            animation: neonPulse 3s ease-in-out infinite alternate;
        }
        .login-card h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            font-family: var(--font-title);
            font-size: 1.8rem;
            color: #f8fafc;
        }
        .auth-input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-main);
            border-radius: 14px;
            transition: all 0.2s ease;
        }
        .auth-input:focus {
            outline: none;
            border-color: rgba(124, 58, 237, 0.6);
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.12);
            background: rgba(255,255,255,0.08);
        }
        .login-field {
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
            margin-bottom: 1.2rem;
        }
        .login-field label {
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 500;
        }
        .login-helpers {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.4rem;
        }
        .login-helpers a {
            color: #06b6d4;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .login-action {
            width: 100%;
            padding: 14px 16px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .login-action:hover {
            transform: translateY(-1px);
            box-shadow: 0 16px 32px rgba(124, 58, 237, 0.2);
        }
        .login-footer {
            text-align: center;
            margin-top: 1.6rem;
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        .login-footer a {
            color: #7c3aed;
            text-decoration: none;
            font-weight: 700;
        }
        .login-error {
            color: #fb7185;
            text-align: center;
            margin-bottom: 1rem;
            font-size: 0.95rem;
        }
        .social-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 700;
            text-decoration: none;
            color: #ffffff;
            transition: background-color 0.2s, transform 0.2s;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
        }
        .social-button.google .icon { width: 18px; height: 18px; }
        
        .separator {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .separator::before, .separator::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .separator:not(:empty)::before {
            margin-right: .5em;
        }
        .separator:not(:empty)::after {
            margin-left: .5em;
        }
        
        /* Fix auto-fill styles to blend with dark mode */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px #1e293b inset !important;
            -webkit-text-fill-color: white !important;
            transition: background-color 5000s ease-in-out 0s;
        }
        @media (max-width: 520px) {
            .login-card { padding: 1.8rem 1.5rem 2rem; }
            .login-brand { flex-direction: column; gap: 0.6rem; }
        }
    </style>
</head>
<body class="auth-wrapper">
    <div class="login-card">
        <div class="login-brand">
            <img src="{% static 'imagenes/logo.png' %}" alt="MiniAmigixV Logo">
            <h1>MiniAmigixV</h1>
        </div>
        <h2>Crear cuenta</h2>
        <form method="POST">
            {% csrf_token %}
            <div class="login-field">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" class="auth-input" value="{{ username|default:'' }}" required>
            </div>
            <div class="login-field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" class="auth-input" value="{{ email|default:'' }}" required>
            </div>
            <div class="login-field">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" class="auth-input" required>
            </div>
            <div class="login-field">
                <label for="password_confirm">Confirmar Contraseña</label>
                <input type="password" id="password_confirm" name="password_confirm" class="auth-input" required>
            </div>
            {% if error %}
                <p class="login-error">{{ error }}</p>
            {% endif %}
            <button class="login-action" type="submit">Registrarse</button>
        </form>

        <div class="separator"><span>O</span></div>

        <div style="display: flex; flex-direction: column; gap: 10px; align-items: center;">
            <a href="{% provider_login_url 'google' %}" class="social-button google" style="max-width: 360px; width:100%;">
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,8.065,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/><path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,8.065,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,3.467,0.833,6.718,2.306,9.691V14.691z"/><path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.64,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/><path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/></svg>
                Registrarse con Google
            </a>
        </div>

        <p class="login-footer">
            ¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión aquí</a>
        </p>
    </div>
</body>
</html>
