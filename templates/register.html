{% load static %}
{% load socialaccount %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - MiniAmigix</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/configuraciones.css' %}">
    <style>
        .auth-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-dark);
        }
        .auth-input {
            width: 100%;
            padding: 10px;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 8px;
        }
        .social-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            color: var(--text-main);
            transition: background-color 0.2s, transform 0.2s;
            border: 1px solid var(--border-color);
            background-color: transparent;
            max-width: 300px;
            margin: 0 auto;
        }
        .social-button:hover {
            transform: translateY(-2px);
            background-color: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
        }
        .social-button .icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
        .separator {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin: 2.5rem 0;
            position: relative;
            text-align: center;
        }
        .separator span {
            background: var(--bg-dark);
            padding: 0 15px;
            color: var(--text-muted);
            font-weight: 600;
            position: relative;
            top: 10px;
        }
    </style>
</head>
<body class="auth-wrapper">
    <div class="config-card">
        <h2 style="text-align: center; margin-bottom: 2rem; font-family: var(--font-title);">RegisterPage</h2>
        <form method="POST">
            {% csrf_token %}
            <div class="config-option" style="flex-direction: column; align-items: flex-start; gap: 8px;">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" class="auth-input" required>
            </div>
            <div class="config-option" style="flex-direction: column; align-items: flex-start; gap: 8px;">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" class="auth-input" required>
            </div>
            <div class="config-option" style="flex-direction: column; align-items: flex-start; gap: 8px;">
                <label for="password_confirm">Confirmar Contraseña</label>
                <input type="password" id="password_confirm" name="password_confirm" class="auth-input" required>
            </div>
            {% if error %}
                <p style="color: #ff4d4d; font-size: 0.9rem; margin-top: 10px; text-align: center;">{{ error }}</p>
            {% endif %}
            <button type="submit">Registrarse</button>
        </form>

        <div class="separator"><span>O</span></div>

        <div style="display: flex; flex-direction: column; gap: 10px;">
            <a href="{% provider_login_url 'google' %}" class="social-button google">
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,8.065,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/><path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,8.065,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,3.467,0.833,6.718,2.306,9.691V14.691z"/><path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.64,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/><path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/></svg>
                Registrarse con Google
            </a>
            <a href="{% provider_login_url 'github' %}" class="social-button github">
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="currentColor" d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.6.111.819-.258.819-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.545-1.387-1.328-1.756-1.328-1.756-1.089-.745.083-.73.083-.73 1.205.084 1.838 1.238 1.838 1.238 1.07 1.835 2.809 1.305 3.492.997.108-.775.419-1.305.762-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.046.138 3.006.404 2.29-1.552 3.297-1.23 3.297-1.23.645 1.653.24 2.873.105 3.176.77.84 1.235 1.91 1.235 3.22 0 4.61-2.801 5.625-5.471 5.922.43.37.817 1.12.817 2.259 0 1.606-.015 2.896-.015 3.286 0 .315.219.695.824.57C20.565 21.801 24,17.309,24,12 24 5.373 18.627 0 12 0z"/></svg>
                Registrarse con GitHub
            </a>
        </div>

        <p style="text-align: center; margin-top: 1.5rem; color: var(--text-muted);">
            ¿Ya tienes cuenta? <a href="{% url 'login' %}" style="color: #7c3aed; text-decoration: none; font-weight: 600;">Inicia sesión aquí</a>
        </p>
    </div>
</body>
</html>
