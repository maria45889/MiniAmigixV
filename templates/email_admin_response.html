<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Respuesta de MiniAmigixV</title>
</head>
<body style="font-family: Inter, sans-serif; background: #0b1220; color: #e2e8f0; margin: 0; padding: 24px;">
    <div style="max-width: 600px; margin: 0 auto; background: #111827; border-radius: 20px; border: 1px solid rgba(255,255,255,0.08); overflow: hidden;">
        <div style="padding: 24px; background: linear-gradient(135deg, #7c3aed, #06b6d4); color: white;">
            <h1 style="margin: 0; font-size: 24px;">Respuesta de MiniAmigixV</h1>
        </div>
        <div style="padding: 24px; color: #e2e8f0; background: #111827;">
            <p style="margin-bottom: 18px;">{{ message|linebreaksbr }}</p>
            <p style="margin: 18px 0 0; color: #94a3b8;">Este mensaje fue enviado por {{ sender.username }} desde el panel de administración de MiniAmigixV.</p>
            <p style="margin: 12px 0 0; color: #94a3b8;">Si no esperabas este correo, puedes ignorarlo.</p>
        </div>
        <div style="padding: 24px; background: #0f172a; color: #94a3b8; font-size: 13px;">
            <p style="margin: 0;">MiniAmigixV - Tu asistente personal interactivo.</p>
        </div>
    </div>
</body>
</html>
