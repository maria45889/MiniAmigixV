{% extends "base.html" %}
{% load static %}

{% block title %}Crear Evento{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/eventos.css' %}">
{% endblock %}

{% block content %}
<div class="eventos-container">
    <h1>📅 Crear Nuevo Evento</h1>
    
    <form method="POST" class="evento-form">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="titulo">Título del Evento</label>
            <input type="text" id="titulo" name="titulo" required placeholder="Ej: Reunión de trabajo">
        </div>
        
        <div class="form-group">
            <label for="descripcion">Descripción (opcional)</label>
            <textarea id="descripcion" name="descripcion" rows="4" placeholder="Detalles del evento..."></textarea>
        </div>
        
        <div class="form-group">
            <label for="fecha">Fecha y Hora</label>
            <input type="datetime-local" id="fecha" name="fecha" required>
        </div>
        
        <div class="form-actions">
            <a href="{% url 'lista_eventos' %}" class="btn-secondary">Cancelar</a>
            <button type="submit" class="btn-primary">Guardar Evento</button>
        </div>
    </form>
</div>
{% endblock %}
