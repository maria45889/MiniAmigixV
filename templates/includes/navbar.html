{% load static %}
<style>
    .navbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; gap: 12px; }
    .nav-left { flex: 0 0 auto; display:flex; align-items:center; gap:12px; }
    .nav-center { flex: 1 1 auto; display:flex; justify-content:center; }
    .nav-right { flex: 0 0 auto; display:flex; align-items:center; gap:36px; }
    .digital-clock { font-weight: 800; color: var(--text-main); font-size: 20px; min-width: 180px; text-align: center; padding: 8px 16px; border-radius: 10px; background: rgba(255,255,255,0.03); box-shadow: 0 6px 18px rgba(0,0,0,0.45); }
    .notification-btn { position: relative; background: none; border: none; color: var(--text-main); cursor: pointer; display: inline-flex; align-items: center; text-decoration: none; padding: 10px; border-radius:10px; }
    .notification-btn:hover { background: rgba(255,255,255,0.05); }
    .notification-badge { position: absolute; top: -6px; right: -6px; background: #ef4444; color: white; font-size: 11px; font-weight: 700; padding: 3px 7px; border-radius: 12px; min-width: 20px; text-align: center; }
    .theme-btn { background: none; border: none; color: var(--text-main); cursor: pointer; display: flex; align-items: center; padding: 10px; border-radius: 10px; }
    .theme-btn:hover { background: rgba(255,255,255,0.02); }
    .nav-right i, .nav-left i { font-size: 20px; display: inline-flex; color: var(--text-main); line-height: 1; }
    .nav-right .notification-btn:hover, .theme-btn:hover { transform: translateY(-3px); }
    .nav-right .notification-btn i, .theme-btn i { width: 22px; height: 22px; }
    @media (max-width: 768px) { .digital-clock { min-width: 100px; font-size: 16px; } }
</style>
<nav class="navbar">
    <div class="nav-left">
        <h2 class="navbar-logo-text" style="font-family: var(--font-title); font-weight: 800; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 10px rgba(124, 58, 237, 0.4); margin: 0;">MiniAmigixV</h2>
        <span style="font-weight: 600; color: var(--text-muted);">/ {% block nav_title %}{% block title %}Inicio{% endblock %}{% endblock %}</span>
    </div>

    <div class="nav-center">
        <!-- Reloj Digital centrado -->
        <div id="digital-clock" class="digital-clock">--:--</div>
    </div>

    <div class="nav-right">
        <!-- Notificaciones -->
        <a href="{% url 'lista_notificaciones' %}" class="notification-btn" title="Notificaciones">
            <i class="ti ti-bell"></i>
            {% if user.is_authenticated and notificaciones_sin_leer > 0 %}
            <span class="notification-badge">{{ notificaciones_sin_leer }}</span>
            {% endif %}
        </a>

        <!-- Tema -->
        <button class="theme-btn" onclick="toggleTheme()" title="Cambiar tema"><i class="ti ti-moon"></i></button>
    </div>
</nav>

<script>
// Reloj Digital en Tiempo Real
function updateClock() {
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const seconds = String(now.getSeconds()).padStart(2, '0');
    const clockElement = document.getElementById('digital-clock');
    if (clockElement) {
        clockElement.textContent = `${hours}:${minutes}:${seconds}`;
    }
}

// Actualizar el reloj cada segundo
setInterval(updateClock, 1000);
updateClock(); // Inicializar inmediatamente
</script>
