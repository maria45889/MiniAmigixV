{% load static %}
<nav class="navbar">
    <div class="nav-left">
        <h2 class="navbar-logo-text" style="font-family: var(--font-title); font-weight: 800; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 10px rgba(124, 58, 237, 0.4); margin: 0;">Supernova</h2>
        <span style="font-weight: 600; color: var(--text-muted);">/ <span data-i18n="home">{% block nav_title %}Inicio{% endblock %}</span></span>
    </div>

    <div class="nav-center">
        <!-- Search Bar -->
        <div class="search-container">
            <i class="ti ti-search search-icon"></i>
            <input type="text" class="search-input" placeholder="Buscar...">
        </div>
    </div>

    <div class="nav-right">
        <!-- Accesibilidad -->
        <a href="{% url 'configuracion_view' %}?tab=accesibilidad" class="accessibility-btn" aria-label="Configurar accesibilidad" title="Configurar accesibilidad">
            <span>♿</span>
        </a>

        <!-- Sugerencias -->
        <a href="{% url 'lista_sugerencias' %}" class="notification-btn" aria-label="Ver sugerencias" title="Sugerencias">
            <i class="ti ti-message"></i>
        </a>

        <!-- Notificaciones -->
        <a href="{% url 'lista_notificaciones' %}" class="notification-btn" aria-label="Ver notificaciones" title="Notificaciones">
            <i class="ti ti-bell"></i>
            {% if user.is_authenticated and notificaciones_sin_leer > 0 %}
            <span class="notification-badge">{{ notificaciones_sin_leer }}</span>
            {% endif %}
        </a>

        <!-- Tema -->
        <button class="theme-btn" onclick="toggleTheme()" aria-label="Cambiar tema claro/oscuro" title="Cambiar tema"><i class="ti ti-moon"></i></button>

        <!-- Profile -->
        {% if user.is_authenticated %}
        <a href="{% url 'perfil' %}" class="profile-btn" aria-label="Ver perfil de usuario" title="Perfil">
            <div class="profile-avatar">
                {{ user.username|first|upper }}
                <div class="profile-online"></div>
            </div>
            <span class="profile-name">{{ user.username }}</span>
        </a>
        {% endif %}
    </div>
</nav>
