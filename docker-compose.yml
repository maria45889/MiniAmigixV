version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: miniamigixv_db
      POSTGRES_USER: miniamigixv_user
      POSTGRES_PASSWORD: miniamigixv_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  mongodb:
    image: mongo:6.0
    environment:
      MONGO_INITDB_DATABASE: miniamigixv_db
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"

  redis:
    image: redis:7.0-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  web:
    build: .
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      - db
      - mongodb
      - redis
    environment:
      - DEBUG=1
      - SECRET_KEY=django-insecure-change-this-in-production
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - DATABASE_URL=postgresql://miniamigixv_user:miniamigixv_password@db:5432/miniamigixv_db
      - MONGODB_URI=mongodb://mongodb:27017/miniamigixv_db
      - REDIS_URL=redis://redis:6379/0

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  static_volume:
  media_volume:
