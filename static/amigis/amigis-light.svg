<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <clipPath id="body-clip">
      <ellipse cx="60" cy="70" rx="35" ry="28" />
    </clipPath>
    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE44D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bodyGradientOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB347;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bodyGradientWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0F0F0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bodyGradientPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB6C1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF69B4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="beakGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C5A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B35;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Cola -->
  <g id="tail">
    <ellipse cx="30" cy="75" rx="10" ry="15" fill="#E6B800" transform="rotate(-30 30 75)" />
  </g>

  <!-- Cuerpo del patito -->
  <g id="body">
    <ellipse cx="60" cy="70" rx="35" ry="28" fill="url(#bodyGradient)" />
  </g>


  <!-- Camiseta (oculta por defecto) -->
  <g id="shirt" class="clothing-item" data-type="shirt" style="display: none;">
    <rect x="35" y="60" width="50" height="25" rx="5" fill="#FFFFFF" />
    <text x="60" y="77" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#333" text-anchor="middle">Amigis</text>
  </g>

  <!-- Cabeza del patito -->
  <g id="head">
    <circle cx="60" cy="38" r="25" fill="url(#bodyGradient)" />
  </g>

  <!-- Ojo izquierdo -->
  <g id="left-eye">
    <circle cx="50" cy="33" r="7" fill="white" />
    <circle cx="50" cy="33" r="3.5" fill="#333" />
    <circle cx="51" cy="31" r="1.5" fill="white" />
  </g>

  <!-- Ojo derecho -->
  <g id="right-eye">
    <circle cx="70" cy="33" r="7" fill="white" />
    <circle cx="70" cy="33" r="3.5" fill="#333" />
    <circle cx="71" cy="31" r="1.5" fill="white" />
  </g>

  <!-- Pico -->
  <g id="beak">
    <ellipse cx="60" cy="45" rx="9" ry="6" fill="url(#beakGradient)" />
    <ellipse cx="60" cy="43" rx="4" ry="2" fill="#FF8C5A" />
  </g>

  <!-- Mejilla izquierda -->
  <g id="left-cheek">
    <circle cx="42" cy="42" r="5" fill="rgba(255,150,150,0.6)" />
  </g>

  <!-- Mejilla derecha -->
  <g id="right-cheek">
    <circle cx="78" cy="42" r="5" fill="rgba(255,150,150,0.6)" />
  </g>

  <!-- Accesorios -->
  <!-- Gafas (ocultas por defecto) -->
  <g id="accessory-glasses" class="accessory-item" style="display: none;">
    <circle cx="50" cy="33" r="10" fill="none" stroke="#333" stroke-width="2" />
    <circle cx="70" cy="33" r="10" fill="none" stroke="#333" stroke-width="2" />
    <line x1="60" y1="33" x2="60" y2="33" stroke="#333" stroke-width="2" />
    <line x1="40" y1="33" x2="30" y2="30" stroke="#333" stroke-width="2" />
    <line x1="80" y1="33" x2="90" y2="30" stroke="#333" stroke-width="2" />
  </g>

  <!-- Gorra (visible por defecto) -->
  <g id="accessory-hat" class="accessory-item">
    <ellipse cx="60" cy="20" rx="20" ry="8" fill="#333" />
    <rect x="40" y="12" width="40" height="10" rx="3" fill="#333" />
    <ellipse cx="60" cy="22" rx="25" ry="5" fill="#444" />
  </g>

  <!-- Lazo (oculto por defecto) -->
  <g id="accessory-bow" class="accessory-item" style="display: none;">
    <ellipse cx="60" cy="15" rx="8" ry="5" fill="#FF69B4" transform="rotate(-30 60 15)" />
    <ellipse cx="60" cy="15" rx="8" ry="5" fill="#FF69B4" transform="rotate(30 60 15)" />
    <circle cx="60" cy="15" r="3" fill="#FF1493" />
  </g>

  <!-- Ala izquierda -->
  <g id="left-wing">
    <ellipse cx="28" cy="65" rx="12" ry="18" fill="#E6B800" transform="rotate(-20 28 65)" />
  </g>

  <!-- Ala derecha -->
  <g id="right-wing">
    <ellipse cx="92" cy="65" rx="12" ry="18" fill="#E6B800" transform="rotate(20 92 65)" />
  </g>

  <!-- Patita izquierda -->
  <g id="left-foot">
    <ellipse cx="48" cy="95" rx="9" ry="5" fill="#FF6B35" />
  </g>

  <!-- Patita derecha -->
  <g id="right-foot">
    <ellipse cx="72" cy="95" rx="9" ry="5" fill="#FF6B35" />
  </g>

  <!-- Laptop -->
  <g id="laptop">
    <!-- Pantalla -->
    <rect x="75" y="55" width="25" height="18" rx="2" fill="#F5F5F5" stroke="#DDD" stroke-width="1" />
    <!-- Logo MiniAmigixV en pantalla -->
    <text x="87.5" y="66" font-family="Arial, sans-serif" font-size="6" fill="#666" text-anchor="middle">MV</text>
    <!-- Base del teclado -->
    <rect x="72" y="73" width="31" height="3" rx="1" fill="#E0E0E0" />
  </g>
</svg>
