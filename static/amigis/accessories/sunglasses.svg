<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Gafas de sol -->
  <g id="sunglasses">
    <!-- Marco de las gafas -->
    <rect x="38" y="28" width="22" height="14" rx="3" fill="#1A1A1A" stroke="#333" stroke-width="1" />
    <rect x="60" y="28" width="22" height="14" rx="3" fill="#1A1A1A" stroke="#333" stroke-width="1" />
    
    <!-- Lentes oscuros -->
    <rect x="40" y="30" width="18" height="10" rx="2" fill="#222" />
    <rect x="62" y="30" width="18" height="10" rx="2" fill="#222" />
    
    <!-- Puente nasal -->
    <line x1="60" y1="33" x2="60" y2="35" stroke="#333" stroke-width="2" />
    
    <!-- Patillas -->
    <line x1="38" y1="33" x2="32" y2="32" stroke="#333" stroke-width="2" />
    <line x1="82" y1="33" x2="88" y2="32" stroke="#333" stroke-width="2" />
  </g>
</svg>
