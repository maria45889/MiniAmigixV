<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Globo de diálogo -->
  <g id="speech-bubble">
    <!-- Globo principal -->
    <ellipse cx="60" cy="15" rx="25" ry="18" fill="white" stroke="#DDD" stroke-width="2" />
    
    <!-- Colita del globo -->
    <path d="M 50 30 Q 45 40 55 35" fill="white" stroke="#DDD" stroke-width="2" />
    
    <!-- Puntos suspensivos -->
    <circle cx="52" cy="15" r="2" fill="#666" />
    <circle cx="60" cy="15" r="2" fill="#666" />
    <circle cx="68" cy="15" r="2" fill="#666" />
  </g>
</svg>
