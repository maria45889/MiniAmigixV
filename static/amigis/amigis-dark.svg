<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 180" width="160" height="180">
  <defs>
    <!-- Gradientes cuerpo -->
    <radialGradient id="bodyGrad" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFE55C"/>
      <stop offset="60%" stop-color="#FFD100"/>
      <stop offset="100%" stop-color="#FFA800"/>
    </radialGradient>
    <radialGradient id="headGrad" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFED6A"/>
      <stop offset="60%" stop-color="#FFD100"/>
      <stop offset="100%" stop-color="#FFA800"/>
    </radialGradient>
    <radialGradient id="bellyGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFF4C2"/>
      <stop offset="100%" stop-color="#FFE68A"/>
    </radialGradient>
    <radialGradient id="wingGrad" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFD940"/>
      <stop offset="100%" stop-color="#F59E00"/>
    </radialGradient>
    <radialGradient id="beakGrad" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FF9C50"/>
      <stop offset="100%" stop-color="#E85D00"/>
    </radialGradient>
    <radialGradient id="footGrad" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FF8C42"/>
      <stop offset="100%" stop-color="#D45200"/>
    </radialGradient>
    <!-- Glow para laptop -->
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Glow suave cuerpo -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#FFA80040"/>
    </filter>
    <!-- Blush cheeks -->
    <radialGradient id="blushGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7EB3" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF7EB3" stop-opacity="0"/>
    </radialGradient>
    <!-- Laptop screen gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#1A2030"/>
    </linearGradient>
    <!-- Headband gradient -->
    <linearGradient id="headbandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9B4DFF"/>
      <stop offset="50%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#9B4DFF"/>
    </linearGradient>
  </defs>

  <!-- Sombra suave -->
  <ellipse cx="80" cy="168" rx="38" ry="8" fill="#00000030"/>

  <!-- Cola -->
  <ellipse cx="25" cy="110" rx="14" ry="10" fill="#FFC200" transform="rotate(-40 25 110)"/>

  <!-- Cuerpo -->
  <ellipse cx="80" cy="120" rx="46" ry="40" fill="url(#bodyGrad)" filter="url(#softShadow)"/>

  <!-- Barriga más clara -->
  <ellipse cx="80" cy="125" rx="28" ry="24" fill="url(#bellyGrad)"/>

  <!-- Ala izquierda -->
  <ellipse cx="36" cy="115" rx="14" ry="22" fill="url(#wingGrad)" transform="rotate(-18 36 115)"/>

  <!-- Ala derecha -->
  <ellipse cx="124" cy="115" rx="14" ry="22" fill="url(#wingGrad)" transform="rotate(18 124 115)"/>

  <!-- Cuello -->
  <ellipse cx="80" cy="88" rx="22" ry="10" fill="url(#bodyGrad)"/>

  <!-- Cabeza -->
  <circle cx="80" cy="65" r="34" fill="url(#headGrad)" filter="url(#softShadow)"/>

  <!-- Vincha/headband de colores -->
  <g id="headband">
    <rect x="48" y="37" width="64" height="9" rx="4.5" fill="url(#headbandGrad)" opacity="0.95"/>
    <!-- Puntos brillantes en la vincha -->
    <circle cx="62" cy="41.5" r="2.5" fill="white" opacity="0.5"/>
    <circle cx="80" cy="41.5" r="2.5" fill="white" opacity="0.5"/>
    <circle cx="98" cy="41.5" r="2.5" fill="white" opacity="0.5"/>
  </g>

  <!-- Ojo izquierdo -->
  <g id="left-eye">
    <circle cx="65" cy="60" r="10" fill="white"/>
    <circle cx="66" cy="61" r="6" fill="#1A1A2E"/>
    <circle cx="64" cy="59" r="2.5" fill="#5B5BFF"/>
    <!-- Brillo -->
    <circle cx="62" cy="57" r="2" fill="white"/>
    <circle cx="67" cy="63" r="1" fill="white" opacity="0.6"/>
  </g>

  <!-- Ojo derecho -->
  <g id="right-eye">
    <circle cx="95" cy="60" r="10" fill="white"/>
    <circle cx="96" cy="61" r="6" fill="#1A1A2E"/>
    <circle cx="94" cy="59" r="2.5" fill="#5B5BFF"/>
    <!-- Brillo -->
    <circle cx="92" cy="57" r="2" fill="white"/>
    <circle cx="97" cy="63" r="1" fill="white" opacity="0.6"/>
  </g>

  <!-- Pico -->
  <g id="beak">
    <ellipse cx="80" cy="76" rx="12" ry="8" fill="url(#beakGrad)"/>
    <!-- Línea del pico -->
    <path d="M70 76 Q80 80 90 76" stroke="#D45200" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Fosa nasal -->
    <ellipse cx="76" cy="73" rx="1.5" ry="1" fill="#C44800" opacity="0.7"/>
    <ellipse cx="84" cy="73" rx="1.5" ry="1" fill="#C44800" opacity="0.7"/>
    <!-- Reflejo pico -->
    <ellipse cx="78" cy="71" rx="5" ry="2.5" fill="white" opacity="0.2"/>
  </g>

  <!-- Mejillas -->
  <circle cx="52" cy="70" r="9" fill="url(#blushGrad)"/>
  <circle cx="108" cy="70" r="9" fill="url(#blushGrad)"/>

  <!-- Laptop en el ala derecha -->
  <g id="laptop">
    <!-- Pantalla laptop -->
    <rect x="93" y="100" width="38" height="28" rx="4" fill="url(#screenGrad)" stroke="#3A4060" stroke-width="1.5"/>
    <!-- Reflejo pantalla -->
    <rect x="93" y="100" width="38" height="6" rx="4" fill="white" opacity="0.06"/>
    <!-- Código en pantalla -->
    <text x="112" y="111" font-family="'Courier New', monospace" font-size="5" fill="#00D4FF" text-anchor="middle" filter="url(#glowCyan)">&lt;MV/&gt;</text>
    <rect x="97" y="114" width="12" height="1.5" rx="1" fill="#9B4DFF" opacity="0.8"/>
    <rect x="97" y="117" width="18" height="1.5" rx="1" fill="#00D4FF" opacity="0.6"/>
    <rect x="97" y="120" width="10" height="1.5" rx="1" fill="#FF6B9D" opacity="0.7"/>
    <rect x="111" y="117" width="8" height="1.5" rx="1" fill="#50FA7B" opacity="0.6"/>
    <!-- Base/teclado -->
    <rect x="90" y="128" width="44" height="5" rx="2.5" fill="#2A2F45" stroke="#3A4060" stroke-width="1"/>
    <!-- Touchpad -->
    <rect x="106" y="130" width="12" height="2" rx="1" fill="#3A4060"/>
  </g>

  <!-- Patita izquierda -->
  <g id="left-foot">
    <ellipse cx="62" cy="157" rx="14" ry="7" fill="url(#footGrad)"/>
    <!-- Dedos -->
    <ellipse cx="52" cy="158" rx="5" ry="4" fill="url(#footGrad)" transform="rotate(-15 52 158)"/>
    <ellipse cx="62" cy="160" rx="5" ry="4" fill="url(#footGrad)"/>
    <ellipse cx="72" cy="158" rx="5" ry="4" fill="url(#footGrad)" transform="rotate(15 72 158)"/>
  </g>

  <!-- Patita derecha (medio oculta por laptop) -->
  <g id="right-foot">
    <ellipse cx="98" cy="157" rx="14" ry="7" fill="url(#footGrad)"/>
    <ellipse cx="88" cy="158" rx="5" ry="4" fill="url(#footGrad)" transform="rotate(-15 88 158)"/>
    <ellipse cx="98" cy="160" rx="5" ry="4" fill="url(#footGrad)"/>
    <ellipse cx="108" cy="158" rx="5" ry="4" fill="url(#footGrad)" transform="rotate(15 108 158)"/>
  </g>

  <!-- Camiseta (oculta por defecto) -->
  <g id="shirt" class="clothing-item" data-type="shirt" style="display: none;">
    <rect x="50" y="100" width="60" height="28" rx="6" fill="#1A1A1A"/>
    <text x="80" y="119" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#00FFFF" text-anchor="middle">Amigis</text>
  </g>

  <!-- Gafas (ocultas por defecto) -->
  <g id="accessory-glasses" class="accessory-item" style="display: none;">
    <circle cx="65" cy="60" r="12" fill="none" stroke="#00FFFF" stroke-width="2" filter="url(#glowCyan)"/>
    <circle cx="95" cy="60" r="12" fill="none" stroke="#00FFFF" stroke-width="2" filter="url(#glowCyan)"/>
    <line x1="77" y1="60" x2="83" y2="60" stroke="#00FFFF" stroke-width="2"/>
    <line x1="53" y1="60" x2="46" y2="57" stroke="#00FFFF" stroke-width="2"/>
    <line x1="107" y1="60" x2="114" y2="57" stroke="#00FFFF" stroke-width="2"/>
  </g>

  <!-- Gorra (visible por defecto) -->
  <g id="accessory-hat" class="accessory-item">
    <ellipse cx="80" cy="34" rx="30" ry="7" fill="#1A1A1A"/>
    <rect x="52" y="15" width="56" height="20" rx="5" fill="#1A1A1A"/>
    <ellipse cx="80" cy="36" rx="36" ry="7" fill="#2A2A2A"/>
    <!-- Logo en gorra -->
    <text x="80" y="28" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#9B4DFF" text-anchor="middle">MV</text>
  </g>

  <!-- Lazo (oculto por defecto) -->
  <g id="accessory-bow" class="accessory-item" style="display: none;">
    <ellipse cx="80" cy="20" rx="10" ry="6" fill="#FF1493" transform="rotate(-30 80 20)"/>
    <ellipse cx="80" cy="20" rx="10" ry="6" fill="#FF1493" transform="rotate(30 80 20)"/>
    <circle cx="80" cy="20" r="4" fill="#FF69B4"/>
  </g>
</svg>
