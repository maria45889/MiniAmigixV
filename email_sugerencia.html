<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f0fdfa; margin: 0; padding: 20px; }
        .card { max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 25px rgba(45, 212, 191, 0.15); border: 1px solid #ccfbf1; }
        .banner { background: linear-gradient(135deg, #2dd4bf 0%, #7c3aed 100%); color: #ffffff; padding: 40px 20px; text-align: center; }
        .banner h2 { margin: 0; font-size: 28px; font-weight: 800; }
        .info-box { padding: 30px; }
        .user-tag { display: inline-block; background: #f1f5f9; padding: 5px 12px; border-radius: 20px; color: #475569; font-size: 14px; margin-bottom: 20px; }
        .message-content { background: #f8fafc; border-left: 4px solid #2dd4bf; padding: 20px; color: #334155; font-style: italic; line-height: 1.6; border-radius: 0 8px 8px 0; }
        .footer { background: #f1f5f9; padding: 15px; text-align: center; font-size: 12px; color: #94a3b8; }
        .highlight { color: #7c3aed; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <div class="banner">
            <h2>💡 Nueva Sugerencia</h2>
            <p>¡Alguien tiene una idea para MiniAmigixV!</p>
        </div>
        <div class="info-box">
            <div class="user-tag">
                De: <strong>{{ nombre }}</strong> ({{ email }})
            </div>
            
            <div class="message-content">
                "{{ mensaje }}"
            </div>
            
            <p style="margin-top: 25px; font-size: 14px; color: #64748b;">
                Enviado el día <span class="highlight">{{ fecha }}</span> desde el formulario rápido.
            </p>
        </div>
        <div class="footer">
            &copy; 2026 MiniAmigixV Admin Panel
        </div>
    </div>
</body>
</html>
